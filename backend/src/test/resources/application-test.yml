spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:timecraft_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/sample
  cache:
    type: simple

app:
  jwt:
    secret: test-only-jwt-secret-key-with-at-least-32-bytes-0123456789abcdef
    issuer: timecraft
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  admin:
    email: admin@timecraft.test
    password: AdminPassword123
    first-name: Test
    last-name: Admin
  razorpay:
    key-id: rzp_test_timecraft123
    key-secret: rzp_test_secret_abc987
    webhook-secret: rzp_webhook_secret_xyz456
  mail:
    enabled: false
    log-links: false
  rate-limit:
    enabled: true
    auth-capacity: 50
    auth-window: 1m

timecraft:
  checkout:
    max-cod-amount: 500000
  payment:
    payu:
      merchant-key: otqqIX
      merchant-salt: Vx6TKHBnxErLEvbrTmLZGMb4eVEAtyQM
      base-url: https://test.payu.in

management:
  health:
    redis:
      enabled: false
