spring:
  application:
    name: timecraft
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/timecraft_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:timecraft}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: timecraft-pool
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:redis}
    cache-names: brands,categories,productDetails,storeSettings,homeContent
    redis:
      time-to-live: ${CACHE_TTL:10m}
      key-prefix: "timecraft::"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  thymeleaf:
    cache: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${ADMIN_SESSION_TIMEOUT:30m}
      cookie:
        name: TC_ADMIN_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  compression:
    enabled: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: timecraft
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  cookies:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
  tokens:
    email-verification-ttl: 24h
    password-reset-ttl: 30m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Store}
    last-name: ${ADMIN_LAST_NAME:Administrator}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:timecraft}
    max-file-size-bytes: 5242880
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-base-url: https://api.razorpay.com/v1
    test-sandbox-enabled: ${RAZORPAY_TEST_SANDBOX:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:TimeCraft <no-reply@timecraft.example>}
    log-links: false
  rate-limit:
    enabled: true
    store: ${RATE_LIMIT_STORE:memory}
    auth-capacity: 10
    auth-window: 1m
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    dev-quick-login-enabled: ${GOOGLE_DEV_QUICK_LOGIN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  packages-to-scan: com.timecraft
  paths-to-match: /api/**

logging:
  level:
    root: INFO
    com.timecraft: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/sample
  cache:
    type: ${CACHE_TYPE:simple}
  thymeleaf:
    cache: false
  web:
    resources:
      # Serve the storefront straight from ../frontend during development (no rebuild needed).
      static-locations: file:../frontend/,classpath:/static/
app:
  jwt:
    # Development-only fallback. Production refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef0123456789}
  razorpay:
    test-sandbox-enabled: ${RAZORPAY_TEST_SANDBOX:true}
  mail:
    log-links: true
management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
logging:
  level:
    com.timecraft: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
app:
  cookies:
    secure: true
  mail:
    enabled: ${MAIL_ENABLED:true}
logging:
  level:
    com.timecraft: INFO
