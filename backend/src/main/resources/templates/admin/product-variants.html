<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Variants · ' + ${product.name})}"></head>
<body>
<div class="tc-shell">
    <aside th:replace="~{admin/fragments :: sidebar('products')}"></aside>
    <div class="tc-main">
        <header th:replace="~{admin/fragments :: topbar('Variants · ' + ${product.name})}"></header>
        <main class="tc-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="tc-card">
                        <h2 class="h5 serif mb-3">Add Variant</h2>
                        <form th:action="@{'/admin/products/' + ${product.id} + '/variants'}" method="post" class="vstack gap-2">
                            <div>
                                <label class="form-label small">Variant SKU *</label>
                                <input type="text" name="sku" class="form-control" required th:placeholder="${product.sku} + '-BLU'">
                            </div>
                            <div>
                                <label class="form-label small">Variant Label *</label>
                                <input type="text" name="name" class="form-control" required placeholder="Blue dial / Steel Bracelet">
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Dial Color</label>
                                    <input type="text" name="dialColor" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Strap Material</label>
                                    <input type="text" name="strapMaterial" class="form-control">
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Regular Price Override</label>
                                    <input type="number" step="0.01" name="regularPriceOverride" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Selling Price Override</label>
                                    <input type="number" step="0.01" name="sellingPriceOverride" class="form-control">
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Opening Stock</label>
                                    <input type="number" name="initialStock" value="10" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Low-Stock Alert</label>
                                    <input type="number" name="lowStockThreshold" value="5" class="form-control">
                                </div>
                            </div>
                            <button type="submit" class="btn-tc mt-2">Create Variant</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="tc-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 serif mb-0">Configured Variants</h2>
                            <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}" class="btn-tc-outline btn-sm text-decoration-none">&larr; Back to Watch</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>SKU</th>
                                    <th>Label</th>
                                    <th class="text-end">Price</th>
                                    <th class="text-end">Available Stock</th>
                                    <th>Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="v : ${product.variants}">
                                    <td class="num fw-medium" th:text="${v.sku}">SKU</td>
                                    <td th:text="${v.name}">Name</td>
                                    <td class="text-end num">₹<span th:text="${v.sellingPrice}">0</span></td>
                                    <td class="text-end num" th:text="${v.availableStock}">0</td>
                                    <td><span class="badge-tc" th:text="${v.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td>
                                    <td class="text-end">
                                        <form th:action="@{'/admin/products/' + ${product.id} + '/variants/' + ${v.id} + '/delete'}" method="post" class="d-inline">
                                            <button type="submit" class="btn-tc-outline btn-sm text-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
