<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${pageTitle} + ' · TimeCraft Admin'">TimeCraft Admin</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --tc-offwhite: #FAF9F6;
            --tc-stone: #F0EFEA;
            --tc-charcoal: #1A1A1A;
            --tc-border: #E5E2DC;
            --tc-gold: #B08D57;
            --tc-muted: #6C6962;
        }
        body {
            background: var(--tc-offwhite);
            color: var(--tc-charcoal);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
        }
        h1, h2, h3, .serif {
            font-family: 'Instrument Serif', Georgia, serif;
            font-weight: 400;
        }
        .num { font-variant-numeric: tabular-nums; }
        .tc-shell { display: flex; min-height: 100vh; }
        .tc-sidebar {
            width: 248px;
            background: var(--tc-charcoal);
            color: var(--tc-offwhite);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .tc-shell.sidebar-collapsed .tc-sidebar { width: 72px; }
        .tc-shell.sidebar-collapsed .tc-brand > div,
        .tc-shell.sidebar-collapsed .tc-nav a span,
        .tc-shell.sidebar-collapsed .tc-signout-label { display: none; }
        .tc-card {
            background: #fff;
            border: 1px solid var(--tc-border);
            border-radius: 2px;
            padding: 1.25rem;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }
        .tc-card:hover { box-shadow: 0 8px 22px rgba(26,26,26,0.05); }
        @keyframes tcRowReveal {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        tbody tr { animation: tcRowReveal 0.32s ease both; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        .tc-brand {
            padding: 1.35rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.14em;
            font-size: 1.25rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--tc-offwhite);
        }
        .tc-brand span { color: var(--tc-gold); font-size: 0.72rem; display: block; letter-spacing: 0.18em; }
        .tc-nav a {
            display: block;
            padding: 0.62rem 1.5rem;
            color: rgba(250,249,246,0.74);
            text-decoration: none;
            font-size: 0.86rem;
            border-left: 2px solid transparent;
        }
        .tc-nav a:hover, .tc-nav a.active {
            color: #fff;
            background: rgba(255,255,255,0.06);
            border-left-color: var(--tc-gold);
        }
        .tc-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .tc-topbar {
            background: #fff;
            border-bottom: 1px solid var(--tc-border);
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tc-content { padding: 1.75rem 2rem; }
        .tc-card {
            background: #fff;
            border: 1px solid var(--tc-border);
            border-radius: 2px;
            padding: 1.25rem;
        }
        .tc-kpi-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--tc-muted);
        }
        .tc-kpi-value {
            font-size: 1.75rem;
            font-weight: 600;
            margin-top: 0.25rem;
            font-variant-numeric: tabular-nums;
        }
        .btn-tc {
            background: var(--tc-charcoal);
            color: var(--tc-offwhite);
            border: 1px solid var(--tc-charcoal);
            border-radius: 2px;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.48rem 1rem;
        }
        .btn-tc:hover { background: #333; color: #fff; }
        .btn-tc-outline {
            background: transparent;
            color: var(--tc-charcoal);
            border: 1px solid var(--tc-border);
            border-radius: 2px;
            font-size: 0.82rem;
            padding: 0.45rem 0.9rem;
        }
        .btn-tc-outline:hover { border-color: var(--tc-charcoal); }
        .form-control, .form-select {
            border-radius: 2px;
            border-color: var(--tc-border);
            font-size: 0.88rem;
        }
        .table th {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--tc-muted);
            background: var(--tc-stone);
            border-bottom: 1px solid var(--tc-border);
        }
        .badge-tc {
            background: var(--tc-stone);
            color: var(--tc-charcoal);
            border: 1px solid var(--tc-border);
            font-weight: 500;
            border-radius: 2px;
            padding: 0.28em 0.6em;
        }
    </style>
</head>
<body>
<aside th:fragment="sidebar(activeNav)" class="tc-sidebar">
    <a href="/admin/dashboard" class="tc-brand serif d-flex align-items-center gap-2">
        <img src="/images/favicon.svg" alt="TimeCraft" style="width:32px;height:32px;">
        <div>
            TimeCraft
            <span>Admin Atelier</span>
        </div>
    </a>
    <nav class="tc-nav py-2 flex-grow-1">
        <a href="/admin/dashboard" th:classappend="${activeNav == 'dashboard'} ? 'active'">Dashboard</a>
        <a href="/admin/orders" th:classappend="${activeNav == 'orders'} ? 'active'">Orders</a>
        <a href="/admin/products" th:classappend="${activeNav == 'products'} ? 'active'">Watches &amp; Catalog</a>
        <a href="/admin/brands" th:classappend="${activeNav == 'brands'} ? 'active'">Brands</a>
        <a href="/admin/categories" th:classappend="${activeNav == 'categories'} ? 'active'">Categories</a>
        <a href="/admin/inventory" th:classappend="${activeNav == 'inventory'} ? 'active'">Inventory &amp; Stock</a>
        <a href="/admin/customers" th:classappend="${activeNav == 'customers'} ? 'active'">Customers</a>
        <a href="/admin/payments" th:classappend="${activeNav == 'payments'} ? 'active'">Payments</a>
        <a href="/admin/refunds" th:classappend="${activeNav == 'refunds'} ? 'active'">Refunds</a>
        <a href="/admin/coupons" th:classappend="${activeNav == 'coupons'} ? 'active'">Coupons</a>
        <a href="/admin/shipments" th:classappend="${activeNav == 'shipments'} ? 'active'">Shipments</a>
        <a href="/admin/returns" th:classappend="${activeNav == 'returns'} ? 'active'">Returns</a>
        <a href="/admin/reviews" th:classappend="${activeNav == 'reviews'} ? 'active'">Reviews</a>
        <a href="/admin/support" th:classappend="${activeNav == 'support'} ? 'active'">Customer Support</a>
        <a href="/admin/reports" th:classappend="${activeNav == 'reports'} ? 'active'">Reports &amp; Analytics</a>
        <a href="/admin/audit-logs" th:classappend="${activeNav == 'audit'} ? 'active'">Audit Logs</a>
        <a href="/admin/settings" th:classappend="${activeNav == 'settings'} ? 'active'">Store Settings</a>
    </nav>
    <div class="p-3 border-top border-secondary">
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light w-100">
                <span class="tc-signout-label">Sign Out</span>
            </button>
        </form>
    </div>
</aside>

<header th:fragment="topbar(title)" class="tc-topbar">
    <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn-tc-outline py-1 px-2" id="tcToggleSidebar" title="Toggle Sidebar"
                onclick="document.querySelector('.tc-shell').classList.toggle('sidebar-collapsed')">&#9776;</button>
        <h1 class="h3 mb-0 serif" th:text="${title}">Dashboard</h1>
    </div>
    <div class="d-flex align-items-center gap-3 small">
        <a href="/admin/orders" class="btn-tc-outline py-1 px-2 text-decoration-none">Orders</a>
        <a href="/admin/products" class="btn-tc-outline py-1 px-2 text-decoration-none">Catalog</a>
        <span class="badge-tc">ROLE: ADMIN</span>
        <span th:text="${#authentication?.name}">admin@timecraft.example</span>
    </div>
</header>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success rounded-0 py-2 small" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger rounded-0 py-2 small" th:text="${errorMessage}"></div>
</div>
</body>
</html>
