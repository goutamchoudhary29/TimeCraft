<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Coupons & Discounts')}"></head>
<body>
<div class="tc-shell">
    <aside th:replace="~{admin/fragments :: sidebar('coupons')}"></aside>
    <div class="tc-main">
        <header th:replace="~{admin/fragments :: topbar('Coupons & Promotional Codes')}"></header>
        <main class="tc-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="tc-card">
                        <h2 class="h5 serif mb-3">Create / Update Coupon</h2>
                        <form th:action="@{/admin/coupons}" method="post" class="vstack gap-2">
                            <input type="hidden" name="id">
                            <div>
                                <label class="form-label small">Coupon Code *</label>
                                <input type="text" name="code" class="form-control text-uppercase" required placeholder="WELCOME10">
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Discount Type *</label>
                                    <select name="discountType" class="form-select">
                                        <option th:each="dt : ${discountTypes}" th:value="${dt}" th:text="${dt}"></option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Discount Value *</label>
                                    <input type="number" step="0.01" name="discountValue" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Min Order Value</label>
                                    <input type="number" step="0.01" name="minOrderValue" value="0" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Max Discount Cap</label>
                                    <input type="number" step="0.01" name="maxDiscount" class="form-control">
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Start Date *</label>
                                    <input type="date" name="startDate" value="2026-01-01" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Expiry Date *</label>
                                    <input type="date" name="endDate" value="2027-12-31" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small">Total Usage Limit</label>
                                    <input type="number" name="usageLimit" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Per-Customer Limit</label>
                                    <input type="number" name="perCustomerLimit" value="1" class="form-control">
                                </div>
                            </div>
                            <div>
                                <label class="form-label small">Description</label>
                                <input type="text" name="description" class="form-control">
                            </div>
                            <label class="small"><input type="checkbox" name="active" value="true" checked> Active</label>
                            <button type="submit" class="btn-tc mt-2">Save Coupon</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="tc-card">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Type / Value</th>
                                    <th class="text-end">Min Order</th>
                                    <th class="text-end">Max Cap</th>
                                    <th class="text-end">Used / Limit</th>
                                    <th>Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c : ${coupons}">
                                    <td class="num fw-semibold" th:text="${c.code}">WELCOME10</td>
                                    <td class="num" th:text="${c.discountType.name() == 'PERCENTAGE' ? c.discountValue + '%' : '₹' + c.discountValue}">10%</td>
                                    <td class="text-end num">₹<span th:text="${c.minOrderValue}">0</span></td>
                                    <td class="text-end num" th:text="${c.maxDiscount != null ? '₹' + c.maxDiscount : '—'}">—</td>
                                    <td class="text-end num" th:text="${c.usedCount} + ' / ' + ${c.usageLimit ?: '∞'}">0</td>
                                    <td>
                                        <span th:if="${c.active}" class="badge bg-success">Active</span>
                                        <span th:unless="${c.active}" class="badge bg-secondary">Disabled</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{'/admin/coupons/' + ${c.id} + '/toggle'}" method="post" class="d-inline">
                                            <input type="hidden" name="active" th:value="${!c.active}">
                                            <button type="submit" class="btn-tc-outline btn-sm" th:text="${c.active ? 'Disable' : 'Enable'}">Toggle</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
