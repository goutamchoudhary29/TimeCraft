<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Refund Management')}"></head>
<body>
<div class="tc-shell">
    <aside th:replace="~{admin/fragments :: sidebar('refunds')}"></aside>
    <div class="tc-main">
        <header th:replace="~{admin/fragments :: topbar('Refund Management')}"></header>
        <main class="tc-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="tc-card">
                        <h2 class="h5 serif mb-3">Initiate Validated Refund</h2>
                        <form th:action="@{/admin/refunds}" method="post" class="vstack gap-2">
                            <div>
                                <label class="form-label small">Order ID *</label>
                                <input type="number" name="orderId" class="form-control" required>
                            </div>
                            <div>
                                <label class="form-label small">Return Request ID (optional)</label>
                                <input type="number" name="returnRequestId" class="form-control">
                            </div>
                            <div>
                                <label class="form-label small">Refund Amount (blank = full refundable)</label>
                                <input type="number" step="0.01" name="amount" class="form-control">
                            </div>
                            <div>
                                <label class="form-label small">Reason *</label>
                                <input type="text" name="reason" class="form-control" required placeholder="Approved return / cancelled paid order">
                            </div>
                            <button type="submit" class="btn-tc mt-2">Execute Razorpay Refund</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="tc-card">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Refund #</th>
                                    <th>Order #</th>
                                    <th>Provider Refund ID</th>
                                    <th class="text-end">Amount</th>
                                    <th>Status</th>
                                    <th>Reason</th>
                                    <th>Processed</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(refunds.content)}">
                                    <td colspan="7" class="text-center text-muted py-3">No refunds issued yet.</td>
                                </tr>
                                <tr th:each="r : ${refunds.content}">
                                    <td class="num fw-semibold" th:text="${r.refundNumber}">RFD-1</td>
                                    <td class="num" th:text="${r.orderNumber}">TC-1</td>
                                    <td class="num small" th:text="${r.providerRefundId ?: '—'}">rfnd_1</td>
                                    <td class="text-end num">₹<span th:text="${r.amount}">0.00</span></td>
                                    <td><span class="badge-tc" th:text="${r.status}">PROCESSED</span></td>
                                    <td class="small" th:text="${r.reason}">Reason</td>
                                    <td class="small text-muted num" th:text="${r.processedAt != null ? #temporals.format(r.processedAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
