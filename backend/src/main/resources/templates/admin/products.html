<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Watch Catalog')}"></head>
<body>
<div class="tc-shell">
    <aside th:replace="~{admin/fragments :: sidebar('products')}"></aside>
    <div class="tc-main">
        <header th:replace="~{admin/fragments :: topbar('Watch Catalog Management')}"></header>
        <main class="tc-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <div class="tc-card mb-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <form method="get" action="/admin/products" class="d-flex flex-wrap gap-2">
                    <input type="text" name="search" th:value="${search}" class="form-control" style="width:220px;" placeholder="Name, SKU or model">
                    <select name="brandId" class="form-select" style="width:170px;">
                        <option value="">All Brands</option>
                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${brandId == b.id}"></option>
                    </select>
                    <select name="categoryId" class="form-select" style="width:170px;">
                        <option value="">All Categories</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId == c.id}"></option>
                    </select>
                    <select name="status" class="form-select" style="width:140px;">
                        <option value="">All Status</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option>
                    </select>
                    <button type="submit" class="btn-tc">Filter</button>
                </form>
                <a href="/admin/products/new" class="btn-tc text-decoration-none">+ Add Watch</a>
            </div>
            <div class="tc-card">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Timepiece</th>
                            <th>SKU</th>
                            <th>Movement / Spec</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Stock</th>
                            <th>Status</th>
                            <th class="text-end">Manage</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products.content}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <img th:src="${p.primaryImageUrl}" alt="" style="width:42px;height:52px;object-fit:cover;border:1px solid #E5E2DC;">
                                    <div>
                                        <div class="fw-semibold" th:text="${p.name}">Watch</div>
                                        <div class="text-muted small" th:text="${p.brandName} + ' · ' + ${p.categoryName}">Brand</div>
                                    </div>
                                </div>
                            </td>
                            <td class="num small" th:text="${p.sku}">SKU</td>
                            <td class="small" th:text="${p.movementType} + ' · ' + ${p.caseDiameterMm} + 'mm · ' + ${p.waterResistanceM} + 'm'">Spec</td>
                            <td class="text-end num">
                                <div class="fw-semibold">₹<span th:text="${p.sellingPrice}">0</span></div>
                                <div th:if="${p.discountPercent > 0}" class="text-muted small text-decoration-line-through">₹<span th:text="${p.regularPrice}">0</span></div>
                            </td>
                            <td class="text-end num" th:text="${p.totalAvailableStock}">0</td>
                            <td><span class="badge-tc" th:text="${p.status}">ACTIVE</span></td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}" class="btn-tc-outline btn-sm text-decoration-none">Edit</a>
                                    <a th:href="@{'/admin/products/' + ${p.id} + '/variants'}" class="btn-tc-outline btn-sm text-decoration-none">Variants</a>
                                    <a th:href="@{'/admin/products/' + ${p.id} + '/images'}" class="btn-tc-outline btn-sm text-decoration-none">Images</a>
                                    <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post" class="d-inline">
                                        <button type="submit" class="btn-tc-outline btn-sm text-danger">Archive</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
