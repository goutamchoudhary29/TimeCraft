<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Brand Management')}"></head>
<body>
<div class="tc-shell">
    <aside th:replace="~{admin/fragments :: sidebar('brands')}"></aside>
    <div class="tc-main">
        <header th:replace="~{admin/fragments :: topbar('Watch Maisons & Brands')}"></header>
        <main class="tc-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="tc-card">
                        <h2 class="h5 serif mb-3">Create / Update Maison</h2>
                        <form th:action="@{/admin/brands}" method="post" class="vstack gap-2">
                            <input type="hidden" name="id" id="brandIdInput">
                            <div>
                                <label class="form-label small">Brand Name *</label>
                                <input type="text" name="name" id="brandNameInput" class="form-control" required>
                            </div>
                            <div>
                                <label class="form-label small">Slug (optional)</label>
                                <input type="text" name="slug" id="brandSlugInput" class="form-control">
                            </div>
                            <div class="row g-2">
                                <div class="col-7">
                                    <label class="form-label small">Country of Origin</label>
                                    <input type="text" name="countryOfOrigin" id="brandCountryInput" class="form-control" placeholder="Switzerland">
                                </div>
                                <div class="col-5">
                                    <label class="form-label small">Founded Year</label>
                                    <input type="number" name="foundedYear" id="brandYearInput" class="form-control" placeholder="1891">
                                </div>
                            </div>
                            <div>
                                <label class="form-label small">Banner Image URL</label>
                                <input type="url" name="bannerUrl" id="brandBannerInput" class="form-control">
                            </div>
                            <div>
                                <label class="form-label small">Description</label>
                                <textarea name="description" id="brandDescInput" rows="3" class="form-control"></textarea>
                            </div>
                            <div class="d-flex gap-3 my-1">
                                <label class="small"><input type="checkbox" name="featured" id="brandFeaturedInput" value="true"> Featured</label>
                                <label class="small"><input type="checkbox" name="active" id="brandActiveInput" value="true" checked> Active</label>
                            </div>
                            <button type="submit" class="btn-tc mt-2">Save Brand</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="tc-card">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Maison</th>
                                    <th>Slug</th>
                                    <th>Origin</th>
                                    <th>Est.</th>
                                    <th>Featured</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="b : ${brands}">
                                    <td class="fw-semibold" th:text="${b.name}">Brand</td>
                                    <td class="text-muted small" th:text="${b.slug}">slug</td>
                                    <td th:text="${b.countryOfOrigin ?: '—'}">Switzerland</td>
                                    <td class="num" th:text="${b.foundedYear ?: '—'}">1891</td>
                                    <td><span th:if="${b.featured}" class="badge-tc">Featured</span></td>
                                    <td>
                                        <span th:if="${b.active}" class="badge bg-success">Active</span>
                                        <span th:unless="${b.active}" class="badge bg-secondary">Inactive</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{'/admin/brands/' + ${b.id} + '/delete'}" method="post" class="d-inline">
                                            <button type="submit" class="btn-tc-outline btn-sm text-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
