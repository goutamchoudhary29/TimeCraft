<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCraft · Page Unavailable</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#F8F7F4;">
<main class="container" style="max-width:520px;">
    <div class="tc-panel text-center py-5 px-4">
        <div class="tc-eyebrow mb-2" th:text="'HTTP ' + (${status} ?: 404)">HTTP 404</div>
        <h1 class="tc-serif display-5 mb-2" th:text="${status == 403 ? 'Access Restricted' : (status == 500 ? 'Something Went Wrong' : 'Page Not Found')}">Page Not Found</h1>
        <p class="text-muted small mb-4" th:text="${error} ?: 'The requested page or resource could not be found.'">The requested page or resource could not be found.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/" class="btn-tc-primary">Return to Storefront</a>
            <a href="/pages/shop.html" class="btn-tc-outline">Browse Watches</a>
        </div>
    </div>
</main>
</body>
</html>
