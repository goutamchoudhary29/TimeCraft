      <stop offset="100%" stop-color="#0B0B0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="editorialGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="50%" stop-color="#B69152"/>
      <stop offset="100%" stop-color="#785B2D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#editorialBg)"/>
  <rect width="600" height="750" fill="url(#editorialGlow)"/>
  <rect x="28" y="28" width="544" height="694" fill="none" stroke="url(#editorialGold)" stroke-opacity="0.32" stroke-width="1"/>
  <line x1="68" y1="92" x2="532" y2="92" stroke="#C29D5E" stroke-opacity="0.2" stroke-width="0.8"/>
  <line x1="68" y1="658" x2="532" y2="658" stroke="#C29D5E" stroke-opacity="0.2" stroke-width="0.8"/>

