      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="52%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#0B0B0A"/>
    </linearGradient>
    <radialGradient id="editorialGlow" cx="50%" cy="44%" r="54%">
