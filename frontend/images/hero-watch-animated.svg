<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="TimeCraft Calibre TC-01 Mechanical Chronometer">
  <defs>
    <radialGradient id="dialSunburst" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#22201D"/>
      <stop offset="62%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0B0B0A"/>
    </radialGradient>
    <linearGradient id="caseGold" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="35%" stop-color="#C29D5E"/>
      <stop offset="70%" stop-color="#8F6D38"/>
      <stop offset="100%" stop-color="#D7BC88"/>
    </linearGradient>
    <linearGradient id="bezelInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6936"/>
      <stop offset="50%" stop-color="#E5CEA0"/>
      <stop offset="100%" stop-color="#6E5228"/>
    </linearGradient>
  </defs>

  <!-- Sculpted Lugs -->
  <path d="M166 34 L190 34 L198 84 L160 94 Z" fill="url(#caseGold)"/>
  <path d="M314 34 L290 34 L282 84 L320 94 Z" fill="url(#caseGold)"/>
  <path d="M166 446 L190 446 L198 396 L160 386 Z" fill="url(#caseGold)"/>
  <path d="M314 446 L290 446 L282 396 L320 386 Z" fill="url(#caseGold)"/>

  <!-- Fluted Winding Crown -->
  <rect x="424" y="220" width="16" height="40" rx="3" fill="url(#caseGold)"/>
  <line x1="428" y1="224" x2="428" y2="256" stroke="#5E4521" stroke-width="1.2"/>
  <line x1="432" y1="224" x2="432" y2="256" stroke="#5E4521" stroke-width="1.2"/>
  <line x1="436" y1="224" x2="436" y2="256" stroke="#5E4521" stroke-width="1.2"/>

  <!-- Stepped 18K Gold Case & Rehaut -->
  <circle cx="240" cy="240" r="186" fill="url(#caseGold)"/>
  <circle cx="240" cy="240" r="176" fill="#151412" stroke="url(#bezelInner)" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="170" fill="url(#dialSunburst)"/>
  <circle cx="240" cy="240" r="160" fill="none" stroke="#C29D5E" stroke-opacity="0.28" stroke-width="0.75"/>
  <circle cx="240" cy="240" r="122" fill="none" stroke="#C29D5E" stroke-opacity="0.16" stroke-width="0.6"/>

  <!-- Applied Gold Baton Indices -->
  <g stroke="#E2C997" stroke-linecap="butt">
    <line x1="236.5" y1="84" x2="236.5" y2="108" stroke-width="2.6"/>
    <line x1="243.5" y1="84" x2="243.5" y2="108" stroke-width="2.6"/>
    <line x1="240" y1="372" x2="240" y2="396" stroke-width="2.6"/>
    <line x1="84" y1="240" x2="108" y2="240" stroke-width="2.6"/>
    <line x1="372" y1="240" x2="396" y2="240" stroke-width="2.6"/>
    <g transform="translate(240 240)">
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(30)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(60)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(120)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(150)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(210)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(240)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(300)"/>
      <line x1="0" y1="-156" x2="0" y2="-136" stroke-width="2" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Dial Signature -->
  <text x="240" y="154" text-anchor="middle" fill="#F8F6F1" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5.5">TIMECRAFT</text>
  <text x="240" y="170" text-anchor="middle" fill="#C29D5E" font-family="sans-serif" font-size="8" letter-spacing="3.2">CHRONOMETRE · AUTOMATIC</text>

  <!-- Open Balance Aperture at 6 o'clock -->
  <g transform="translate(240 322)">
    <circle r="34" fill="#0B0A09" stroke="#C29D5E" stroke-opacity="0.55" stroke-width="1.1"/>
    <circle r="24" fill="none" stroke="#C29D5E" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#C29D5E" stroke-width="1.2"/>
    <circle r="4.5" fill="#9E3342" stroke="#E2C997" stroke-width="1"/>
  </g>

  <!-- Conventional Balanced 10:10:31 Studio Pose (Exact 240,240 Origin) -->
  <g transform="translate(240 240)">
    <!-- Hour Hand: 10:10 -> 305 deg -->
    <g transform="rotate(305)">
      <polygon points="-4.8,18 4.8,18 2.1,-94 0,-102 -2.1,-94" fill="#F8F6F1"/>
      <line x1="0" y1="12" x2="0" y2="-88" stroke="#C29D5E" stroke-width="0.9"/>
    </g>
    <!-- Minute Hand: 10 min -> 60 deg -->
    <g transform="rotate(60)">
      <polygon points="-3.6,22 3.6,22 1.5,-138 0,-146 -1.5,-138" fill="#F8F6F1"/>
      <line x1="0" y1="14" x2="0" y2="-130" stroke="#C29D5E" stroke-width="0.8"/>
    </g>
    <!-- Second Hand: 31 sec -> 186 deg -->
    <g transform="rotate(186)">
      <line x1="0" y1="34" x2="0" y2="-150" stroke="#D9BA82" stroke-width="1.3"/>
      <circle cx="0" cy="22" r="3.2" fill="#141414" stroke="#D9BA82" stroke-width="1.2"/>
    </g>
    <!-- Center Cap -->
    <circle r="6.5" fill="url(#caseGold)"/>
    <circle r="2.2" fill="#141414"/>
  </g>
</svg>
