<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Server-Verified Pricing &amp; Stock</div>
        <h1 class="display-6 tc-serif mb-0">Your Shopping Bag</h1>
    </div>
    <div id="cartHost"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('cart');
    const host = document.getElementById('cartHost');

    async function loadCart() {
        try {
            const cart = await TC.api('/cart');
            TC.updateHeaderBadges(cart);
            if (!cart.items || cart.items.length === 0) {
                host.innerHTML = `
                <div class="tc-panel text-center py-5">
                  <h2 class="tc-serif fs-3">Your bag is currently empty</h2>
                  <p class="text-muted small mb-3">Explore our mechanical and quartz collections to add a timepiece.</p>
                  <a href="/pages/shop.html" class="btn-tc-primary">Explore Watches</a>
                </div>`;
                return;
            }
            const t = cart.totals;
            host.innerHTML = `
            <div class="row g-4">
              <div class="col-lg-8">
                <div class="tc-panel vstack gap-3">
                  ${cart.items.map(item => `
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 border-bottom pb-3">
                      <div class="d-flex align-items-center gap-3">
                        <img src="${TC.escapeHtml(item.imageUrl)}" alt="" style="width:68px;height:85px;object-fit:cover;border:1px solid #E5E2DC;">
                        <div>
                          <div class="tc-eyebrow">${TC.escapeHtml(item.brandName)}</div>
                          <a href="/pages/product-details.html?slug=${encodeURIComponent(item.productSlug)}" class="tc-serif fs-4">${TC.escapeHtml(item.productName)}</a>
                          <div class="small text-muted">${TC.escapeHtml(item.variantName)} · SKU ${TC.escapeHtml(item.variantSku)}</div>
                          ${!item.available ? '<div class="small text-danger fw-semibold">Insufficient stock available</div>' : ''}
                        </div>
                      </div>
                      <div class="d-flex align-items-center gap-3">
                        <input type="number" min="1" max="5" value="${item.quantity}" class="form-control form-control-sm tc-num" style="width:72px;"
                               onchange="window.updateQty(${item.id}, this.value)">
                        <div class="text-end tc-price" style="min-width:110px;">
                          <div class="fw-semibold">${TC.formatInr(item.lineSubtotal)}</div>
                          <div class="small text-muted">${TC.formatInr(item.sellingUnitPrice)} each</div>
                        </div>
                        <button type="button" class="btn-tc-secondary py-1 px-2" onclick="window.removeItem(${item.id})">&times;</button>
                      </div>
                    </div>`).join('')}
                </div>
              </div>
              <div class="col-lg-4">
                <div class="tc-panel">
                  <h2 class="h4 tc-serif mb-3">Order Summary</h2>
                  <form id="couponForm" class="d-flex gap-2 mb-3">
                    <input type="text" id="couponInput" class="form-control form-control-sm text-uppercase"
                           placeholder="Coupon (e.g. WELCOME10)" value="${TC.escapeHtml(cart.appliedCouponCode || '')}">
                    <button type="submit" class="btn-tc-secondary py-1 px-3">Apply</button>
                    ${cart.appliedCouponCode ? '<button type="button" class="btn-tc-secondary py-1 px-2" onclick="window.clearCoupon()">✕</button>' : ''}
                  </form>
                  ${cart.couponMessage ? `<div class="small text-muted mb-2">${TC.escapeHtml(cart.couponMessage)}</div>` : ''}
                  <div class="small vstack gap-2 border-top pt-3 tc-price">
                    <div class="d-flex justify-content-between"><span>Subtotal</span><span>${TC.formatInr(t.subtotal)}</span></div>
                    <div class="d-flex justify-content-between"><span>Discount</span><span>- ${TC.formatInr(t.discountTotal)}</span></div>
                    <div class="d-flex justify-content-between">
                      <span>${t.taxInclusive ? 'Included ' + t.taxLabel + ' (' + t.taxRatePercent + '%)' : t.taxLabel + ' (' + t.taxRatePercent + '%)'}</span>
                      <span>${TC.formatInr(t.taxTotal)}</span>
                    </div>
                    <div class="d-flex justify-content-between"><span>Insured Shipping</span><span>${Number(t.shippingTotal) === 0 ? 'Complimentary' : TC.formatInr(t.shippingTotal)}</span></div>
                    <div class="d-flex justify-content-between border-top pt-2 fs-5 fw-semibold">
                      <span>Payable Total</span><span>${TC.formatInr(t.grandTotal)}</span>
                    </div>
                  </div>
                  <a href="/pages/checkout.html" class="btn-tc-primary w-100 mt-4">Proceed to Checkout</a>
                </div>
              </div>
            </div>`;

            document.getElementById('couponForm').addEventListener('submit', async e => {
                e.preventDefault();
                const code = document.getElementById('couponInput').value;
                try {
                    await TC.api('/cart/coupon', { method: 'POST', body: { code } });
                    TC.toast('Coupon applied');
                    await loadCart();
                } catch (err) {
                    TC.toast(err.message, 'error');
                }
            });
        } catch (err) {
            host.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
        }
    }

    window.updateQty = async (itemId, qty) => {
        try {
            await TC.api('/cart/items/' + itemId, { method: 'PUT', body: { quantity: Number(qty) } });
            await loadCart();
        } catch (err) {
            TC.toast(err.message, 'error');
            await loadCart();
        }
    };
    window.removeItem = async (itemId) => {
        try {
            await TC.api('/cart/items/' + itemId, { method: 'DELETE' });
            await loadCart();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    };
    window.clearCoupon = async () => {
        await TC.api('/cart/coupon', { method: 'DELETE' });
        await loadCart();
    };

    await loadCart();
});
</script>
</body>
</html>
