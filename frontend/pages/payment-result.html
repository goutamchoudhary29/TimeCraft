<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:600px;">
    <div class="tc-panel text-center py-5" id="resultHost"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status') || 'pending';
    const order = params.get('order') || '';
    const reason = params.get('reason') || '';

    document.getElementById('resultHost').innerHTML = `
        <div class="tc-eyebrow mb-2">Payment Status · ${TC.escapeHtml(status.toUpperCase())}</div>
        <h1 class="tc-serif mb-2">${status === 'success' ? 'Payment Verified' : 'Payment Not Completed'}</h1>
        <p class="text-muted small mb-4">
          ${order ? `Order Reference: <strong class="tc-num">${TC.escapeHtml(order)}</strong>.<br>` : ''}
          ${reason ? TC.escapeHtml(reason) : 'Your stock reservation remains active until the payment expiry time shown on your order details page.'}
        </p>
        <div class="d-flex justify-content-center gap-2">
          ${order ? `<a href="/pages/order-details.html?order=${encodeURIComponent(order)}" class="btn-tc-primary">Inspect Order</a>` : ''}
          <a href="/pages/orders.html" class="btn-tc-secondary">All Orders</a>
        </div>`;
});
</script>
</body>
</html>
