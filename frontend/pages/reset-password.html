<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · TimeCraft</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:490px;">
    <div class="tc-panel">
        <div class="tc-eyebrow">Password Reset Verification</div>
        <h1 class="h2 tc-serif mb-2">Choose a New Password</h1>
        <p class="text-muted small mb-3">Enter the 6-digit security code sent to your email along with your new password.</p>

        <div id="resetDevOtpBanner" class="p-3 mb-3 small" style="display:none;background:#FAF6EE;border:1px solid #B08D57;border-radius:2px;">
            <div class="d-flex justify-content-between align-items-center gap-2">
                <div>
                    <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#9A7B4F;font-weight:700;">Local Dev Mode · Reset OTP</div>
                    <div class="mt-1">Reset code: <strong id="resetDevOtpCode" class="fs-5 tc-num" style="letter-spacing:4px;">------</strong></div>
                </div>
                <button type="button" id="fillResetOtpBtn" class="btn-tc-outline py-1 px-2" style="font-size:11px;white-space:nowrap;">Fill Code</button>
            </div>
        </div>

        <form id="resetForm" class="vstack gap-3">
            <div>
                <label class="form-label small text-uppercase">Email Address</label>
                <input type="email" id="resetEmail" class="form-control" required placeholder="collector@example.com">
            </div>
            <div>
                <label class="form-label small text-uppercase">6-Digit Reset OTP</label>
                <input type="text" id="resetOtp" inputmode="numeric" maxlength="6" class="form-control tc-num" required placeholder="Enter 6-digit code" style="letter-spacing:0.25em;font-weight:600;">
            </div>
            <div>
                <label class="form-label small text-uppercase">New Password (min 8 chars, upper + lower + digit)</label>
                <input type="password" id="resetPassword" class="form-control" required minlength="8">
            </div>
            <div>
                <label class="form-label small text-uppercase">Confirm New Password</label>
                <input type="password" id="resetConfirmPassword" class="form-control" required minlength="8">
            </div>
            <div id="resetFeedback" class="small"></div>
            <button type="submit" id="resetSubmitBtn" class="btn-tc-primary w-100">Update Password</button>
        </form>

        <div class="border-top mt-4 pt-3 small d-flex justify-content-between">
            <a href="/pages/forgot-password.html">&larr; Request New Code</a>
            <a href="/pages/login.html">Back to Sign In</a>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    if (params.get('email')) {
        document.getElementById('resetEmail').value = params.get('email');
    }
    const legacyToken = params.get('token') || '';
    if (legacyToken && !params.get('email')) {
        document.getElementById('resetOtp').value = legacyToken;
    }

    const devOtp = sessionStorage.getItem('tc_reset_dev_otp');
    if (devOtp) {
        document.getElementById('resetDevOtpCode').textContent = devOtp;
        document.getElementById('resetDevOtpBanner').style.display = 'block';
        document.getElementById('fillResetOtpBtn').addEventListener('click', () => {
            document.getElementById('resetOtp').value = devOtp;
        });
    }

    document.getElementById('resetForm').addEventListener('submit', async e => {
        e.preventDefault();
        const fb = document.getElementById('resetFeedback');
        const btn = document.getElementById('resetSubmitBtn');
        const email = document.getElementById('resetEmail').value.trim();
        const otp = document.getElementById('resetOtp').value.trim();
        const newPassword = document.getElementById('resetPassword').value;
        const confirmPassword = document.getElementById('resetConfirmPassword').value;

        if (newPassword !== confirmPassword) {
            fb.innerHTML = '<span class="text-danger">Passwords do not match.</span>';
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Updating Password…';
        fb.textContent = '';

        try {
            const payload = /^\d{6}$/.test(otp)
                ? { email, otp, newPassword }
                : { email, token: otp, newPassword };
            const res = await TC.api('/auth/reset-password', {
                method: 'POST',
                body: payload
            });
            sessionStorage.removeItem('tc_reset_dev_otp');
            fb.innerHTML = '<span class="text-success fw-semibold">&#10003; Password updated! Redirecting to sign in…</span>';
            TC.toast((res && res.message) || 'Password updated successfully');
            setTimeout(() => { window.location.href = '/pages/login.html'; }, 1000);
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Update Password';
            fb.innerHTML = `<span class="text-danger">${TC.escapeHtml(err.message)}</span>`;
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
