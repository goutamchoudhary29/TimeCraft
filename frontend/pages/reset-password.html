<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:460px;">
    <div class="tc-panel">
        <div class="tc-eyebrow">Password Reset</div>
        <h1 class="h2 tc-serif mb-2">Choose a New Password</h1>
        <form id="resetForm" class="vstack gap-3">
            <div>
                <label class="form-label small text-uppercase">Reset Token</label>
                <input type="text" id="resetToken" class="form-control" required>
            </div>
            <div>
                <label class="form-label small text-uppercase">New Password (min 8 chars, upper + lower + digit)</label>
                <input type="password" id="resetPassword" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn-tc-primary w-100">Update Password</button>
        </form>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    if (params.get('token')) {
        document.getElementById('resetToken').value = params.get('token');
    }
    document.getElementById('resetForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const res = await TC.api('/auth/reset-password', {
                method: 'POST',
                body: {
                    token: document.getElementById('resetToken').value,
                    newPassword: document.getElementById('resetPassword').value
                }
            });
            TC.toast(res.message);
            setTimeout(() => { window.location.href = '/pages/login.html'; }, 900);
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
