<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insured Checkout · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Stock Reservation &amp; Razorpay Verification</div>
        <h1 class="display-6 tc-serif mb-0">Secure Horological Checkout</h1>
    </div>
    <div id="checkoutHost"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    if (!TC.getUser()) {
        window.location.href = '/pages/login.html?next=/pages/checkout.html';
        return;
    }
    const host = document.getElementById('checkoutHost');

    try {
        const [cart, addresses, profile] = await Promise.all([
            TC.api('/cart'),
            TC.api('/addresses'),
            TC.api('/customer/profile').catch(() => null)
        ]);
        if (profile && !profile.emailVerified) {
            host.innerHTML = `
              <div class="tc-panel text-center py-5" style="max-width:560px;margin:0 auto;border-top:4px solid #B08D57;">
                <div class="tc-eyebrow mb-2">Email Verification Required</div>
                <h2 class="tc-serif mb-2">Verify Your Email Before Ordering</h2>
                <p class="text-muted small mb-4">
                  Your account (<strong>${TC.escapeHtml(profile.email)}</strong>) is not yet verified.
                  Click below to receive a 6-digit OTP in your email and unlock Razorpay &amp; Cash on Delivery checkout.
                </p>
                <button type="button" id="chkVerifyEmailBtn" class="btn-tc-primary">Send 6-Digit OTP &amp; Verify Now &rarr;</button>
              </div>`;
            document.getElementById('chkVerifyEmailBtn')?.addEventListener('click', async (ev) => {
                const b = ev.currentTarget;
                b.disabled = true;
                b.textContent = 'Sending OTP…';
                try {
                    const res = await TC.api('/auth/resend-otp', { method: 'POST', body: { email: profile.email } });
                    if (res && res.devOtp) sessionStorage.setItem('tc_dev_otp', res.devOtp);
                    window.location.href = '/verify-otp?email=' + encodeURIComponent(profile.email);
                } catch (err) {
                    b.disabled = false;
                    b.textContent = 'Send 6-Digit OTP & Verify Now →';
                    TC.toast(err.message, 'error');
                }
            });
            return;
        }
        if (!cart.items || !cart.items.length) {
            host.innerHTML = `<div class="tc-panel text-center py-5"><h2 class="tc-serif">Your bag is empty</h2><a href="/pages/shop.html" class="btn-tc-primary mt-2">Explore Watches</a></div>`;
            return;
        }
        const t = cart.totals;
        const defaultAddr = addresses.find(a => a.defaultAddress) || addresses[0];

        host.innerHTML = `
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="tc-panel mb-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 tc-serif mb-0">1. Insured Delivery Destination</h2>
                <a href="/pages/addresses.html" class="small text-uppercase">Manage Addresses &rarr;</a>
              </div>
              ${addresses.length === 0 ? `
                <div class="alert alert-warning rounded-0 small">
                  Please <a href="/pages/addresses.html" class="fw-semibold">add a delivery address</a> before placing your order.
                </div>` : `
                <div class="vstack gap-2">
                  ${addresses.map(a => `
                    <label class="border p-3 d-flex gap-2 align-items-start" style="cursor:pointer;">
                      <input type="radio" name="selectedAddress" value="${a.id}" class="mt-1" ${defaultAddr && a.id === defaultAddr.id ? 'checked' : ''}>
                      <div class="small">
                        <div class="fw-semibold">${TC.escapeHtml(a.fullName)} (${a.addressType})</div>
                        <div>${TC.escapeHtml(a.line1)} ${a.line2 ? ', ' + TC.escapeHtml(a.line2) : ''}</div>
                        <div>${TC.escapeHtml(a.city)}, ${TC.escapeHtml(a.state)} - <span class="tc-num">${TC.escapeHtml(a.postalCode)}</span></div>
                        <div class="text-muted">Phone: ${TC.escapeHtml(a.phone)}</div>
                      </div>
                    </label>`).join('')}
                </div>`}
            </div>
            <div class="tc-panel mb-3">
              <h2 class="h4 tc-serif mb-3">2. Payment Method</h2>
              <div class="row g-3" id="paymentMethodCards">
                <div class="col-md-6">
                  <label class="border p-3 d-block h-100 tc-pay-choice active" data-method="RAZORPAY" style="cursor:pointer;border-color:#1A1A1A!important;transition:all 0.2s ease;">
                    <div class="d-flex align-items-start gap-2">
                      <input type="radio" name="paymentMethod" value="RAZORPAY" checked class="mt-1">
                      <div>
                        <div class="fw-semibold small">Razorpay Online (UPI · QR · Card)</div>
                        <div class="text-muted" style="font-size:12px;">Instant UPI Intent/VPA, QR Code Scanner, Credit/Debit Cards &amp; Netbanking.</div>
                      </div>
                    </div>
                  </label>
                </div>
                <div class="col-md-6">
                  <label class="border p-3 d-block h-100 tc-pay-choice" data-method="COD" style="cursor:pointer;transition:all 0.2s ease;">
                    <div class="d-flex align-items-start gap-2">
                      <input type="radio" name="paymentMethod" value="COD" class="mt-1">
                      <div>
                        <div class="fw-semibold small">Cash on Delivery (COD)</div>
                        <div class="text-muted" style="font-size:12px;">Pay in cash at your doorstep on delivery (orders up to ₹50,000).</div>
                      </div>
                    </div>
                  </label>
                </div>
              </div>
            </div>
            <div class="tc-panel">
              <h2 class="h4 tc-serif mb-2">3. Concierge Delivery Note (Optional)</h2>
              <textarea id="checkoutNote" rows="2" class="form-control" placeholder="Wrist sizing request, gift card inscription or delivery instructions"></textarea>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="tc-panel">
              <h2 class="h4 tc-serif mb-3">3. Verified Price Breakdown</h2>
              <div class="vstack gap-2 mb-3 border-bottom pb-3">
                ${cart.items.map(i => `
                  <div class="d-flex justify-content-between small">
                    <span>${TC.escapeHtml(i.brandName)} ${TC.escapeHtml(i.productName)} × ${i.quantity}</span>
                    <span class="tc-price fw-medium">${TC.formatInr(i.lineSubtotal)}</span>
                  </div>`).join('')}
              </div>
              <div class="small vstack gap-2 tc-price">
                <div class="d-flex justify-content-between"><span>Subtotal</span><span>${TC.formatInr(t.subtotal)}</span></div>
                <div class="d-flex justify-content-between"><span>Coupon Discount ${cart.appliedCouponCode ? '(' + TC.escapeHtml(cart.appliedCouponCode) + ')' : ''}</span><span>- ${TC.formatInr(t.discountTotal)}</span></div>
                <div class="d-flex justify-content-between"><span>${t.taxInclusive ? 'Included ' + t.taxLabel + ' (' + t.taxRatePercent + '%)' : t.taxLabel + ' (' + t.taxRatePercent + '%)'}</span><span>${TC.formatInr(t.taxTotal)}</span></div>
                <div class="d-flex justify-content-between"><span>Insured Armoured Shipping</span><span>${Number(t.shippingTotal) === 0 ? 'Complimentary' : TC.formatInr(t.shippingTotal)}</span></div>
                <div class="d-flex justify-content-between border-top pt-2 fs-5 fw-semibold">
                  <span>Final Payable</span><span>${TC.formatInr(t.grandTotal)}</span>
                </div>
              </div>
              <button type="button" id="placeOrderBtn" class="btn-tc-primary w-100 mt-4" ${addresses.length === 0 ? 'disabled' : ''}>
                Reserve Stock &amp; Pay via Razorpay
              </button>
              <p class="small text-muted mt-3 mb-0">
                Stock is reserved for 15 minutes when your order is created. Order confirmation occurs only after cryptographic signature verification on our backend.
              </p>
            </div>
          </div>
        </div>`;

        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', () => {
                document.querySelectorAll('.tc-pay-choice').forEach(el => {
                    const isSelected = el.dataset.method === radio.value;
                    el.style.borderColor = isSelected ? '#1A1A1A' : '#E5E2DC';
                    el.style.background = isSelected ? '#FAF9F6' : '#FFFFFF';
                });
                const btn = document.getElementById('placeOrderBtn');
                if (btn) {
                    btn.textContent = radio.value === 'COD'
                        ? 'Confirm Cash on Delivery Order'
                        : 'Reserve Stock & Pay via Razorpay';
                }
            });
        });

        const idempotencyKey = 'chk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        document.getElementById('placeOrderBtn')?.addEventListener('click', async () => {
            const addrRadio = document.querySelector('input[name="selectedAddress"]:checked');
            if (!addrRadio) {
                TC.toast('Please select a delivery address', 'error');
                return;
            }
            const selectedMethod = (document.querySelector('input[name="paymentMethod"]:checked') || { value: 'RAZORPAY' }).value;
            const btn = document.getElementById('placeOrderBtn');
            btn.disabled = true;
            btn.textContent = selectedMethod === 'COD' ? 'Confirming COD Order…' : 'Reserving Stock & Creating Order…';
            let order = null;
            try {
                order = await TC.api('/orders', {
                    method: 'POST',
                    headers: { 'X-Idempotency-Key': idempotencyKey },
                    body: {
                        addressId: Number(addrRadio.value),
                        couponCode: cart.appliedCouponCode,
                        customerNote: document.getElementById('checkoutNote').value,
                        idempotencyKey,
                        paymentMethod: selectedMethod
                    }
                });

                if (selectedMethod === 'COD') {
                    window.location.href = `/pages/order-confirmation.html?order=${encodeURIComponent(order.orderNumber)}&method=COD`;
                    return;
                }

                const paymentOrder = await TC.api('/payments/create', {
                    method: 'POST',
                    body: { orderId: order.id }
                });

                if (paymentOrder.sandboxMode) {
                    openRazorpayTestSandboxModal(order, paymentOrder, btn);
                    return;
                }

                if (typeof Razorpay === 'undefined') {
                    window.location.href = `/pages/payment-result.html?status=pending&order=${encodeURIComponent(order.orderNumber)}&reason=Razorpay+checkout+script+unavailable`;
                    return;
                }

                const cleanContact = (function (raw) {
                    const digits = String(raw || '').replace(/\D/g, '');
                    const last10 = digits.length >= 10 ? digits.slice(-10) : '';
                    return /^[6-9]\d{9}$/.test(last10) ? last10 : '9876543210';
                })(paymentOrder.customerPhone);

                const rzp = new Razorpay({
                    key: paymentOrder.keyId || paymentOrder.razorpayKeyId,
                    amount: paymentOrder.amountInPaise || paymentOrder.amountInMinorUnits,
                    currency: 'INR',
                    name: 'TimeCraft Fine Horology',
                    description: 'Order ' + paymentOrder.orderNumber,
                    order_id: paymentOrder.razorpayOrderId,
                    method: {
                        upi: true,
                        card: true,
                        netbanking: true,
                        wallet: true
                    },
                    prefill: {
                        name: paymentOrder.customerName || 'TimeCraft Collector',
                        email: paymentOrder.customerEmail || '',
                        contact: cleanContact
                    },
                    theme: { color: '#1A1A1A' },
                    handler: async function (response) {
                        try {
                            await TC.api('/payments/verify', {
                                method: 'POST',
                                body: {
                                    orderId: order.id,
                                    razorpayOrderId: response.razorpay_order_id,
                                    razorpayPaymentId: response.razorpay_payment_id,
                                    razorpaySignature: response.razorpay_signature,
                                    paymentMethod: 'RAZORPAY'
                                }
                            });
                            window.location.href = `/pages/order-confirmation.html?order=${encodeURIComponent(order.orderNumber)}`;
                        } catch (verifyErr) {
                            TC.toast('Payment verification failed: ' + verifyErr.message, 'error');
                            window.location.href = `/pages/payment-result.html?status=failed&order=${encodeURIComponent(order.orderNumber)}&reason=${encodeURIComponent(verifyErr.message)}`;
                        }
                    },
                    modal: {
                        ondismiss: async function () {
                            try {
                                await TC.api('/payments/failure', {
                                    method: 'POST',
                                    body: {
                                        orderId: order.id,
                                        razorpayOrderId: paymentOrder.razorpayOrderId,
                                        reason: 'Customer closed payment modal',
                                        cancelled: true
                                    }
                                });
                            } catch (_) { /* ignore cleanup error */ }
                            window.location.href = `/pages/payment-result.html?status=cancelled&order=${encodeURIComponent(order.orderNumber)}`;
                        }
                    }
                });
                rzp.on('payment.failed', async function (resp) {
                    const reason = (resp.error && resp.error.description) || 'Payment declined';
                    try {
                        await TC.api('/payments/failure', {
                            method: 'POST',
                            body: {
                                orderId: order.id,
                                razorpayOrderId: paymentOrder.razorpayOrderId,
                                razorpayPaymentId: resp.error && resp.error.metadata ? resp.error.metadata.payment_id : null,
                                reason,
                                cancelled: true
                            }
                        });
                    } catch (_) { /* ignore cleanup error */ }
                    window.location.href = `/pages/payment-result.html?status=failed&order=${encodeURIComponent(order.orderNumber)}&reason=${encodeURIComponent(reason)}`;
                });
                rzp.open();
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Reserve Stock & Pay via Razorpay';
                if (order && order.orderNumber) {
                    window.location.href = `/pages/payment-result.html?status=pending&order=${encodeURIComponent(order.orderNumber)}&reason=${encodeURIComponent(err.message)}`;
                } else {
                    TC.toast(err.message, 'error');
                }
            }
        });
    } catch (err) {
        host.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
    }

    function openRazorpayTestSandboxModal(order, paymentOrder, triggerBtn) {
        const existing = document.getElementById('tcRzpSandboxModal');
        if (existing) existing.remove();

        const wrap = document.createElement('div');
        wrap.id = 'tcRzpSandboxModal';
        wrap.className = 'tc-google-modal-backdrop';
        wrap.innerHTML = `
          <div class="tc-google-modal" style="max-width:440px;padding:0;overflow:hidden;">
            <div style="background:#1A1A1A;color:#FAF9F6;padding:18px 22px;" class="d-flex justify-content-between align-items-center">
              <div>
                <div style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#B08D57;">Razorpay Test Mode Gateway</div>
                <div class="tc-serif fs-4">TimeCraft Fine Horology</div>
                <div class="small text-white-50 tc-num">Order ${TC.escapeHtml(paymentOrder.orderNumber)} · ${TC.escapeHtml(paymentOrder.razorpayOrderId)}</div>
              </div>
              <div class="text-end">
                <div class="fs-5 fw-bold tc-price">${TC.formatInr(paymentOrder.amount)}</div>
                <span class="badge bg-warning text-dark rounded-0" style="font-size:10px;">TEST MODE</span>
              </div>
            </div>

            <div style="padding:22px;">
              <label class="form-label small text-uppercase fw-semibold">Select Payment Instrument</label>
              <div class="vstack gap-2 mb-3">
                <label class="tc-google-account-pill">
                  <input type="radio" name="rzpMethod" value="UPI" checked>
                  <div>
                    <div class="fw-semibold small">UPI (GPay / PhonePe / BHIM)</div>
                    <div class="text-muted" style="font-size:12px;">Instant UPI VPA authorization · success@razorpay</div>
                  </div>
                </label>
                <label class="tc-google-account-pill">
                  <input type="radio" name="rzpMethod" value="CARD">
                  <div>
                    <div class="fw-semibold small">Credit / Debit Card</div>
                    <div class="text-muted" style="font-size:12px;">Visa / Mastercard Test Card ·••• 4242</div>
                  </div>
                </label>
                <label class="tc-google-account-pill">
                  <input type="radio" name="rzpMethod" value="NETBANKING">
                  <div>
                    <div class="fw-semibold small">Netbanking</div>
                    <div class="text-muted" style="font-size:12px;">HDFC / ICICI / SBI Test Bank</div>
                  </div>
                </label>
              </div>

              <div class="d-grid gap-2">
                <button type="button" id="rzpSimSuccessBtn" class="btn-tc-primary w-100">
                  Authorize &amp; Pay ${TC.formatInr(paymentOrder.amount)} (HMAC Verified)
                </button>
                <div class="d-flex gap-2">
                  <button type="button" id="rzpSimFailBtn" class="btn-tc-secondary flex-grow-1 text-danger">
                    Simulate Bank Decline
                  </button>
                  <button type="button" id="rzpSimCancelBtn" class="btn-tc-secondary flex-grow-1">
                    Cancel
                  </button>
                </div>
              </div>
              <div class="text-muted mt-3" style="font-size:11px;">
                Generates a signed <code>razorpay_payment_id</code> + HMAC-SHA256 <code>razorpay_signature</code> and verifies it through <code>POST /api/v1/payments/verify</code>.
              </div>
            </div>
          </div>`;
        document.body.appendChild(wrap);

        document.getElementById('rzpSimSuccessBtn').addEventListener('click', async () => {
            const btn = document.getElementById('rzpSimSuccessBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying HMAC-SHA256 Signature…';
            const method = document.querySelector('input[name="rzpMethod"]:checked')?.value || 'UPI';
            try {
                const signed = await TC.api('/payments/sandbox-authorize', {
                    method: 'POST',
                    body: {
                        orderId: order.id,
                        razorpayOrderId: paymentOrder.razorpayOrderId,
                        paymentMethod: method
                    }
                });
                await TC.api('/payments/verify', {
                    method: 'POST',
                    body: {
                        orderId: order.id,
                        razorpayOrderId: signed.razorpayOrderId,
                        razorpayPaymentId: signed.razorpayPaymentId,
                        razorpaySignature: signed.razorpaySignature,
                        paymentMethod: signed.paymentMethod
                    }
                });
                wrap.remove();
                window.location.href = `/pages/order-confirmation.html?order=${encodeURIComponent(order.orderNumber)}`;
            } catch (err) {
                wrap.remove();
                window.location.href = `/pages/payment-result.html?status=failed&order=${encodeURIComponent(order.orderNumber)}&reason=${encodeURIComponent(err.message)}`;
            }
        });

        document.getElementById('rzpSimFailBtn').addEventListener('click', async () => {
            await TC.api('/payments/failure', {
                method: 'POST',
                body: {
                    orderId: order.id,
                    razorpayOrderId: paymentOrder.razorpayOrderId,
                    reason: 'Simulated bank decline in Razorpay Test Mode',
                    cancelled: false
                }
            });
            wrap.remove();
            window.location.href = `/pages/payment-result.html?status=failed&order=${encodeURIComponent(order.orderNumber)}&reason=Simulated+bank+decline`;
        });

        document.getElementById('rzpSimCancelBtn').addEventListener('click', async () => {
            await TC.api('/payments/failure', {
                method: 'POST',
                body: {
                    orderId: order.id,
                    razorpayOrderId: paymentOrder.razorpayOrderId,
                    reason: 'Customer cancelled payment modal',
                    cancelled: true
                }
            });
            wrap.remove();
            window.location.href = `/pages/payment-result.html?status=cancelled&order=${encodeURIComponent(order.orderNumber)}`;
        });
    }
});
</script>
</body>
</html>
