<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Horological Concierge · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:780px;">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Private Client Desk</div>
        <h1 class="display-6 tc-serif mb-0">Contact TimeCraft Concierge</h1>
    </div>
    <div class="tc-panel">
        <form id="contactForm" class="row g-3">
            <div class="col-md-6">
                <label class="form-label small text-uppercase">Your Name *</label>
                <input type="text" id="ctName" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small text-uppercase">Email Address *</label>
                <input type="email" id="ctEmail" class="form-control" required>
            </div>
            <div class="col-md-8">
                <label class="form-label small text-uppercase">Subject *</label>
                <input type="text" id="ctSubject" class="form-control" required placeholder="Calibre inquiry, strap sizing or order assistance">
            </div>
            <div class="col-md-4">
                <label class="form-label small text-uppercase">Order # (Optional)</label>
                <input type="text" id="ctOrder" class="form-control tc-num" placeholder="TC-...">
            </div>
            <div class="col-12">
                <label class="form-label small text-uppercase">Message *</label>
                <textarea id="ctMessage" rows="4" class="form-control" required></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn-tc-primary">Submit Inquiry</button>
            </div>
        </form>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('contact');
    const u = TC.getUser();
    if (u) {
        document.getElementById('ctName').value = (u.firstName + ' ' + u.lastName).trim();
        document.getElementById('ctEmail').value = u.email || '';
    }
    document.getElementById('contactForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const ticket = await TC.api('/support/contact', {
                method: 'POST',
                body: {
                    name: document.getElementById('ctName').value,
                    email: document.getElementById('ctEmail').value,
                    subject: document.getElementById('ctSubject').value,
                    orderNumber: document.getElementById('ctOrder').value,
                    message: document.getElementById('ctMessage').value
                }
            });
            TC.toast('Concierge ticket ' + ticket.ticketNumber + ' created');
            e.target.reset();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
