<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Archive · TimeCraft</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="mb-3">
        <a href="/pages/brands.html" class="tc-link-editorial">&larr; All Partner Maisons</a>
    </div>

    <div id="tcBrandBannerWrap" class="d-none mb-4" style="aspect-ratio:21/6;max-height:280px;overflow:hidden;border:1px solid var(--tc-border);background:var(--tc-obsidian);">
        <img id="tcBrandBannerImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.88;">
    </div>

    <div class="tc-section-header">
        <div style="max-width:740px;">
            <div class="tc-eyebrow mb-1" id="tcBrandEyebrow">Authorised Maison</div>
            <h1 class="tc-section-heading mb-2" id="tcCatalogTitle">Maison Timepieces</h1>
            <p class="text-muted small mb-0" id="tcCatalogSubtitle"></p>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-3">
            <span class="small text-muted tc-num" id="tcResultCount">0 references</span>
            <select id="filterSort" class="form-select form-select-sm" style="width:200px;" aria-label="Sort maison references">
                <option value="featured">Sort: Curated Featured</option>
                <option value="newest">Sort: Newest Releases</option>
                <option value="price_desc">Valuation: High to Low</option>
                <option value="price_asc">Valuation: Low to High</option>
            </select>
        </div>
    </div>
    <input type="hidden" id="filterBrand">
    <div class="row g-4" id="tcProductGrid"></div>
    <div id="tcPagination"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('brands');
    await TCCatalog.initCatalogPage('brand');
});
</script>
</body>
</html>
