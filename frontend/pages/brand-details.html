<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Collection · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div style="max-width:720px;">
            <div class="tc-eyebrow">Authorised Maison</div>
            <h1 class="display-6 tc-serif mb-1" id="tcCatalogTitle">Maison Timepieces</h1>
            <p class="text-muted small mb-0" id="tcCatalogSubtitle"></p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="small text-muted tc-num" id="tcResultCount">0 timepieces</span>
            <select id="filterSort" class="form-select form-select-sm" style="width:190px;">
                <option value="featured">Sort: Featured</option>
                <option value="newest">Sort: Newest</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
            </select>
        </div>
    </div>
    <input type="hidden" id="filterBrand">
    <div class="row g-4" id="tcProductGrid"></div>
    <div id="tcPagination"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('brands');
    await TCCatalog.initCatalogPage('brand');
});
</script>
</body>
</html>
