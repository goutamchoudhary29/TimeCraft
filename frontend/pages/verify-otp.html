<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP · TimeCraft</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .tc-otp-grid { display: flex; gap: 10px; justify-content: center; margin: 22px 0; }
        .tc-otp-box {
            width: 48px; height: 56px; text-align: center; font-size: 1.45rem; font-weight: 600;
            border: 1px solid var(--tc-border, #E5E2DC); background: #fff; border-radius: 2px;
            font-variant-numeric: tabular-nums; transition: border-color 0.2s ease, transform 0.15s ease;
        }
        .tc-otp-box:focus { outline: none; border-color: #B08D57; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(176,141,87,0.18); }
        @keyframes tcShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .tc-otp-grid.shake { animation: tcShake 0.36s ease; }
        .tc-otp-success { color: #2C6E49; font-weight: 600; }
    </style>
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:500px;">
    <div class="tc-panel text-center">
        <div class="tc-eyebrow">Email Security Verification</div>
        <h1 class="h2 tc-serif mb-2">Enter 6-Digit Verification Code</h1>
        <p class="text-muted small mb-2">
            We sent a 6-digit OTP to <strong id="otpEmailLabel">your email</strong>. Valid for 10 minutes.
        </p>

        <div id="devOtpBanner" class="p-3 mb-3 small text-start" style="display:none;background:#FAF6EE;border:1px solid #B08D57;border-radius:2px;">
            <div class="d-flex justify-content-between align-items-center gap-2">
                <div>
                    <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#9A7B4F;font-weight:700;">Local Dev Mode · SMTP Not Configured</div>
                    <div class="mt-1">Your 6-digit OTP code: <strong id="devOtpCode" class="fs-5 tc-num" style="letter-spacing:4px;">------</strong></div>
                </div>
                <button type="button" id="autoFillDevOtpBtn" class="btn-tc-outline py-1 px-2" style="font-size:11px;white-space:nowrap;">Fill OTP</button>
            </div>
        </div>

        <form id="otpForm">
            <div class="mb-2 text-start" id="emailInputWrap" style="display:none;">
                <label class="form-label small text-uppercase">Email Address</label>
                <input type="email" id="otpEmailInput" class="form-control" required>
            </div>
            <div class="tc-otp-grid" id="otpGrid">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 1">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 2">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 3">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 4">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 5">
                <input type="text" inputmode="numeric" maxlength="1" class="tc-otp-box" aria-label="Digit 6">
            </div>
            <div id="otpFeedback" class="small mb-3"></div>
            <button type="submit" id="verifyBtn" class="btn-tc-primary w-100">Verify &amp; Activate Account</button>
        </form>

        <div class="border-top mt-4 pt-3 small">
            Didn't receive the code?
            <button type="button" id="resendBtn" class="btn btn-link btn-sm p-0 fw-semibold text-decoration-none" style="color:#B08D57;">
                Resend OTP
            </button>
            <span id="cooldownLabel" class="text-muted ms-1"></span>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email') || '';
    const emailInput = document.getElementById('otpEmailInput');
    const emailLabel = document.getElementById('otpEmailLabel');
    if (emailParam) {
        emailInput.value = emailParam;
        emailLabel.textContent = emailParam;
    } else {
        document.getElementById('emailInputWrap').style.display = 'block';
    }

    const boxes = Array.from(document.querySelectorAll('.tc-otp-box'));
    boxes[0].focus();

    function showDevOtp(code) {
        if (!code) return;
        const banner = document.getElementById('devOtpBanner');
        const codeEl = document.getElementById('devOtpCode');
        if (banner && codeEl) {
            codeEl.textContent = code;
            banner.style.display = 'block';
        }
    }
    showDevOtp(sessionStorage.getItem('tc_dev_otp'));
    document.getElementById('autoFillDevOtpBtn')?.addEventListener('click', () => {
        const code = (document.getElementById('devOtpCode')?.textContent || '').replace(/\D/g, '').slice(0, 6);
        code.split('').forEach((ch, i) => { if (boxes[i]) boxes[i].value = ch; });
        boxes[5]?.focus();
    });

    boxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
            box.value = box.value.replace(/\D/g, '').slice(0, 1);
            if (box.value && idx < boxes.length - 1) boxes[idx + 1].focus();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && idx > 0) boxes[idx - 1].focus();
        });
        box.addEventListener('paste', (e) => {
            const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
            if (pasted.length) {
                e.preventDefault();
                pasted.split('').forEach((ch, i) => { if (boxes[i]) boxes[i].value = ch; });
                boxes[Math.min(pasted.length, 5)].focus();
            }
        });
    });

    const feedback = document.getElementById('otpFeedback');
    const grid = document.getElementById('otpGrid');

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = boxes.map(b => b.value).join('');
        const email = emailInput.value.trim();
        if (otp.length !== 6) {
            grid.classList.remove('shake');
            void grid.offsetWidth;
            grid.classList.add('shake');
            feedback.innerHTML = '<span class="text-danger">Please enter all 6 digits.</span>';
            return;
        }
        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.textContent = 'Verifying…';
        try {
            const data = await TC.api('/auth/verify-otp', {
                method: 'POST',
                body: { email, otp }
            });
            TC.setAuthSession(data);
            feedback.innerHTML = '<span class="tc-otp-success">&#10003; Email verified! Redirecting to your Collector Profile…</span>';
            setTimeout(() => { window.location.href = '/pages/profile.html'; }, 800);
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Verify & Activate Account';
            grid.classList.remove('shake');
            void grid.offsetWidth;
            grid.classList.add('shake');
            feedback.innerHTML = `<span class="text-danger">${TC.escapeHtml(err.message)}</span>`;
        }
    });

    let cooldown = 0;
    const resendBtn = document.getElementById('resendBtn');
    const cooldownLabel = document.getElementById('cooldownLabel');

    function startCooldown(sec) {
        cooldown = sec;
        resendBtn.disabled = true;
        const timer = setInterval(() => {
            cooldown--;
            if (cooldown <= 0) {
                clearInterval(timer);
                resendBtn.disabled = false;
                cooldownLabel.textContent = '';
            } else {
                cooldownLabel.textContent = `(${cooldown}s)`;
            }
        }, 1000);
    }

    resendBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) return;
        try {
            const res = await TC.api('/auth/resend-otp', { method: 'POST', body: { email } });
            if (res && res.devOtp) {
                sessionStorage.setItem('tc_dev_otp', res.devOtp);
                showDevOtp(res.devOtp);
            }
            TC.toast((res && res.message) || 'A fresh 6-digit OTP has been sent to your email.');
            startCooldown(60);
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
