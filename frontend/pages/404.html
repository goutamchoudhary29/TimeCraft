<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5 text-center" style="max-width:560px;">
    <div class="tc-panel py-5">
        <div class="tc-eyebrow mb-2">Error 404</div>
        <h1 class="display-5 tc-serif mb-2">Page Not Found</h1>
        <p class="text-muted small mb-4">The timepiece or page you requested is not in our current catalog.</p>
        <a href="/index.html" class="btn-tc-primary">Return to Homepage</a>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => TC.mountChrome());</script>
</body>
</html>
