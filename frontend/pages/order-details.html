<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" id="orderDetailHost"></main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('orders');
    if (!TC.getUser()) {
        window.location.href = '/pages/login.html';
        return;
    }
    const params = new URLSearchParams(window.location.search);
    const idOrNo = params.get('order') || params.get('id') || '';
    const host = document.getElementById('orderDetailHost');

    async function load() {
        try {
            const o = await TC.api('/orders/' + encodeURIComponent(idOrNo));
            host.innerHTML = `
            <div class="d-flex flex-wrap justify-content-between align-items-end border-bottom pb-3 mb-4">
              <div>
                <div class="tc-eyebrow">Immutable Order Snapshot</div>
                <h1 class="display-6 tc-serif mb-0 tc-num">Order ${TC.escapeHtml(o.orderNumber)}</h1>
                <div class="small text-muted">Status: <strong>${o.status}</strong> · Payment: <strong>${o.paymentStatus}</strong></div>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn-tc-secondary" onclick="window.downloadInvoice('${TC.escapeHtml(o.orderNumber)}')">Download PDF Invoice</button>
                <a href="/pages/order-tracking.html?order=${encodeURIComponent(o.orderNumber)}" class="btn-tc-secondary">Track Shipment</a>
                ${o.status === 'DELIVERED' ? `<a href="/pages/return-request.html?orderId=${o.id}" class="btn-tc-secondary">Request Return</a>` : ''}
                ${o.cancellable ? `<button type="button" class="btn-tc-secondary text-danger" onclick="window.cancelOrd(${o.id})">Cancel Order</button>` : ''}
              </div>
            </div>

            <div class="row g-4">
              <div class="col-lg-8">
                <div class="tc-panel mb-3">
                  <h2 class="h4 tc-serif mb-3">Ordered Timepieces</h2>
                  ${o.items.map(i => `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                      <div>
                        <div class="fw-semibold">${TC.escapeHtml(i.brandName)} · ${TC.escapeHtml(i.productName)}</div>
                        <div class="small text-muted">${TC.escapeHtml(i.variantName)} · SKU ${TC.escapeHtml(i.sku)} · Qty ${i.quantity}</div>
                      </div>
                      <div class="tc-price fw-semibold">${TC.formatInr(i.lineTotal)}</div>
                    </div>`).join('')}
                </div>
                <div class="tc-panel">
                  <h2 class="h4 tc-serif mb-3">Order Status Timeline</h2>
                  ${o.statusHistory.map(h => `
                    <div class="d-flex justify-content-between small border-bottom py-2">
                      <span><strong>${h.toStatus}</strong> — ${TC.escapeHtml(h.note || '')}</span>
                      <span class="text-muted tc-num">${new Date(h.createdAt).toLocaleString()}</span>
                    </div>`).join('')}
                </div>
              </div>
              <div class="col-lg-4">
                <div class="tc-panel mb-3">
                  <h2 class="h5 tc-serif mb-2">Delivery Address</h2>
                  <div class="small">
                    <div class="fw-semibold">${TC.escapeHtml(o.shipFullName)}</div>
                    <div>${TC.escapeHtml(o.shipLine1)} ${o.shipLine2 ? ', ' + TC.escapeHtml(o.shipLine2) : ''}</div>
                    <div>${TC.escapeHtml(o.shipCity)}, ${TC.escapeHtml(o.shipState)} - ${TC.escapeHtml(o.shipPostalCode)}</div>
                    <div class="text-muted">Phone: ${TC.escapeHtml(o.shipPhone)}</div>
                  </div>
                </div>
                <div class="tc-panel small tc-price vstack gap-2">
                  <div class="d-flex justify-content-between"><span>Subtotal</span><span>${TC.formatInr(o.subtotal)}</span></div>
                  <div class="d-flex justify-content-between"><span>Discount</span><span>- ${TC.formatInr(o.discountTotal)}</span></div>
                  <div class="d-flex justify-content-between"><span>${o.taxInclusive ? 'Included GST' : 'GST'}</span><span>${TC.formatInr(o.taxTotal)}</span></div>
                  <div class="d-flex justify-content-between"><span>Insured Shipping</span><span>${TC.formatInr(o.shippingTotal)}</span></div>
                  <div class="d-flex justify-content-between border-top pt-2 fs-5 fw-semibold"><span>Grand Total</span><span>${TC.formatInr(o.grandTotal)}</span></div>
                </div>
              </div>
            </div>`;
        } catch (err) {
            host.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
        }
    }

    window.cancelOrd = async (id) => {
        const reason = prompt('Reason for cancellation:', 'Changed preference');
        if (reason === null) return;
        try {
            await TC.api(`/orders/${id}/cancel`, { method: 'POST', body: { reason } });
            TC.toast('Order cancelled');
            await load();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    };

    window.downloadInvoice = async (orderNumber) => {
        try {
            const token = localStorage.getItem('tc_access_token');
            const res = await fetch(`/api/v1/orders/${encodeURIComponent(orderNumber)}/invoice`, {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            if (!res.ok) throw new Error('Could not generate invoice');
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TimeCraft-Invoice-${orderNumber}.pdf`;
            a.click();
            URL.revokeObjectURL(url);
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    };

    await load();
});
</script>
</body>
</html>
