<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · TimeCraft Fine Horology</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>

<main class="tc-auth-page">
    <section class="tc-auth-card" aria-labelledby="loginHeading">
        <header class="tc-auth-header">
            <div class="tc-auth-eyebrow">Collector Account</div>
            <h1 id="loginHeading" class="tc-auth-heading">Sign In to TimeCraft</h1>
            <p class="tc-auth-subtitle">
                Your guest shopping bag will be merged automatically upon sign-in.
            </p>
        </header>

        <div id="verifyBanner" class="tc-auth-alert is-success d-none" role="status" aria-live="polite"></div>
        <div id="loginErrorBanner" class="tc-auth-alert d-none" role="alert" aria-live="assertive"></div>

        <!-- Google OAuth 2.0 Sign-In -->
        <div id="googleLoginHost"></div>

        <div class="tc-auth-divider">or sign in with email</div>

        <!-- Email & Password Authentication Form -->
        <form id="loginForm" class="tc-auth-form" novalidate>
            <div class="tc-auth-field">
                <label for="loginEmail" class="tc-auth-label">Email Address</label>
                <input type="email"
                       id="loginEmail"
                       name="email"
                       class="tc-auth-input"
                       autocomplete="email"
                       inputmode="email"
                       placeholder="name@example.com"
                       required>
                <div id="loginEmailError" class="tc-auth-field-error d-none"></div>
            </div>

            <div class="tc-auth-field">
                <div class="tc-auth-label-row">
                    <label for="loginPassword" class="tc-auth-label">Password</label>
                    <a href="/pages/forgot-password.html" class="tc-auth-forgot-link">Forgot password?</a>
                </div>
                <div class="tc-password-wrap">
                    <input type="password"
                           id="loginPassword"
                           name="password"
                           class="tc-auth-input"
                           autocomplete="current-password"
                           placeholder="Enter your password"
                           required>
                    <button type="button"
                            id="togglePasswordBtn"
                            class="tc-password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password">
                        <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eyeClosedIcon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M17.94 17.94A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18.8 18.8 0 0 1 5.06-5.94M9.9 4.24A9.8 9.8 0 0 1 12 4c6.4 0 10 7 10 7a18.8 18.8 0 0 1-2.16 3.19" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div id="loginPasswordError" class="tc-auth-field-error d-none"></div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="tc-auth-submit-btn">
                <span>Sign In</span>
            </button>
        </form>

        <footer class="tc-auth-footer">
            New to TimeCraft?
            <a href="/pages/register.html">Create a Collector Account</a>
        </footer>
    </section>
</main>

<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('profile');

    const params = new URLSearchParams(window.location.search);
    const rawNext = params.get('next') || '';
    const safeNextUrl = (rawNext.startsWith('/') && !rawNext.startsWith('//'))
        ? rawNext
        : '/pages/profile.html';

    await TC.mountGoogleAuthButton('googleLoginHost', safeNextUrl);

    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const emailErrorEl = document.getElementById('loginEmailError');
    const passwordErrorEl = document.getElementById('loginPasswordError');
    const errorBannerEl = document.getElementById('loginErrorBanner');
    const verifyBannerEl = document.getElementById('verifyBanner');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeOpen = document.getElementById('eyeOpenIcon');
    const eyeClosed = document.getElementById('eyeClosedIcon');

    // Show / Hide Password Toggle
    toggleBtn.addEventListener('click', () => {
        const showing = passwordInput.type === 'text';
        passwordInput.type = showing ? 'password' : 'text';
        toggleBtn.setAttribute('aria-pressed', String(!showing));
        toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        toggleBtn.title = showing ? 'Show password' : 'Hide password';
        eyeOpen.classList.toggle('d-none', !showing);
        eyeClosed.classList.toggle('d-none', showing);
    });

    // Optional email-verification link token handler
    const verifyToken = params.get('verify');
    if (verifyToken) {
        try {
            const res = await TC.api('/auth/verify-email', {
                method: 'POST',
                body: { token: verifyToken }
            });
            if (res && res.message) {
                verifyBannerEl.textContent = res.message;
                verifyBannerEl.classList.remove('d-none');
            }
        } catch (err) {
            errorBannerEl.textContent = err.message || 'Email verification link has expired or is invalid.';
            errorBannerEl.classList.remove('d-none');
        }
    }

    function clearFieldErrors() {
        emailInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');
        emailErrorEl.textContent = '';
        emailErrorEl.classList.add('d-none');
        passwordErrorEl.textContent = '';
        passwordErrorEl.classList.add('d-none');
        errorBannerEl.innerHTML = '';
        errorBannerEl.classList.add('d-none');
    }

    emailInput.addEventListener('input', () => {
        emailInput.classList.remove('is-invalid');
        emailErrorEl.classList.add('d-none');
    });
    passwordInput.addEventListener('input', () => {
        passwordInput.classList.remove('is-invalid');
        passwordErrorEl.classList.add('d-none');
    });

    function validateInputs() {
        clearFieldErrors();
        let valid = true;
        const emailVal = emailInput.value.trim();
        const passVal = passwordInput.value;

        if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
            emailInput.classList.add('is-invalid');
            emailErrorEl.textContent = 'Please enter a valid email address.';
            emailErrorEl.classList.remove('d-none');
            valid = false;
        }
        if (!passVal) {
            passwordInput.classList.add('is-invalid');
            passwordErrorEl.textContent = 'Please enter your password.';
            passwordErrorEl.classList.remove('d-none');
            valid = false;
        }
        return valid;
    }

    let isSubmitting = false;

    document.getElementById('loginForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (isSubmitting) return;
        if (!validateInputs()) return;

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="tc-btn-spinner" aria-hidden="true"></span><span>Signing In…</span>';

        const emailVal = emailInput.value.trim();

        try {
            const data = await TC.api('/auth/login', {
                method: 'POST',
                body: {
                    email: emailVal,
                    password: passwordInput.value
                }
            });
            TC.setAuthSession(data);
            window.location.href = safeNextUrl;
        } catch (err) {
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In</span>';

            const msg = (err && err.message) ? err.message : 'Unable to sign in. Please verify your credentials and try again.';
            if (/verify.*email|otp/i.test(msg)) {
                errorBannerEl.innerHTML = `${TC.escapeHtml(msg)} <a href="/verify-otp?email=${encodeURIComponent(emailVal)}" class="fw-semibold text-decoration-underline ms-1" style="color:inherit;">Verify Email</a>`;
            } else {
                errorBannerEl.textContent = msg;
            }
            errorBannerEl.classList.remove('d-none');
            TC.toast(msg, 'error');
        }
    });
});
</script>
</body>
</html>
