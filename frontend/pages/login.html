<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign In · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:460px;">
    <div class="tc-panel">
        <div class="tc-eyebrow">Collector Account</div>
        <h1 class="h2 tc-serif mb-2">Sign In to TimeCraft</h1>
        <p class="text-muted small mb-3">Your guest shopping bag will be merged automatically upon sign-in.</p>
        <div id="verifyBanner" class="alert alert-success rounded-0 small d-none"></div>
        <div id="googleLoginHost" class="mb-2"></div>
        <div class="tc-divider">or sign in with email</div>
        <form id="loginForm" class="vstack gap-3">
            <div>
                <label class="form-label small text-uppercase">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" required>
            </div>
            <div>
                <div class="d-flex justify-content-between">
                    <label class="form-label small text-uppercase">Password</label>
                    <a href="/pages/forgot-password.html" class="small text-muted">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn-tc-primary w-100 mt-1">Sign In</button>
        </form>
        <div class="border-top mt-4 pt-3 small text-center">
            New to TimeCraft? <a href="/pages/register.html" class="fw-semibold">Create a Collector Account</a>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    await TC.mountGoogleAuthButton('googleLoginHost', params.get('next') || '/pages/profile.html');
    const verifyToken = params.get('verify');
    if (verifyToken) {
        try {
            const res = await TC.api('/auth/verify-email', { method: 'POST', body: { token: verifyToken } });
            const b = document.getElementById('verifyBanner');
            b.textContent = res.message;
            b.classList.remove('d-none');
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const data = await TC.api('/auth/login', {
                method: 'POST',
                body: {
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                }
            });
            TC.setAuthSession(data);
            window.location.href = params.get('next') || '/pages/profile.html';
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
