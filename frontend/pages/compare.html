<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Timepieces · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <div class="tc-eyebrow">Side-by-Side Horological Dossier</div>
            <h1 class="display-6 tc-serif mb-0">Compare Watches (Max 4)</h1>
        </div>
        <button type="button" class="btn-tc-secondary" id="clearCompareBtn">Clear Comparison</button>
    </div>
    <div id="compareHost"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('compare');
    const host = document.getElementById('compareHost');

    async function render() {
        const ids = TC.getCompareIds();
        if (!ids.length) {
            host.innerHTML = `
            <div class="tc-panel text-center py-5">
              <h2 class="tc-serif fs-3">Your comparison tray is empty</h2>
              <p class="text-muted small mb-3">Click the ⇄ button on up to four watch cards to compare movement, case diameter, water resistance, crystal and warranty side by side.</p>
              <a href="/pages/shop.html" class="btn-tc-primary">Browse Watches</a>
            </div>`;
            return;
        }
        try {
            const watches = await TC.api('/products/compare?ids=' + ids.join(','));
            const row = (label, fn) => `<tr><th>${label}</th>${watches.map(w => `<td>${fn(w)}</td>`).join('')}</tr>`;
            host.innerHTML = `
            <div class="table-responsive tc-panel p-0">
              <table class="table table-bordered tc-spec-table align-middle mb-0">
                <tbody>
                  ${row('Timepiece', w => `
                    <div class="text-center" style="min-width:190px;">
                      <img src="${TC.escapeHtml((w.images && w.images[0] && w.images[0].url) || '')}" alt="" style="width:110px;height:135px;object-fit:cover;border:1px solid #E5E2DC;">
                      <div class="tc-eyebrow mt-2">${TC.escapeHtml(w.brandName)}</div>
                      <a href="/pages/product-details.html?slug=${encodeURIComponent(w.slug)}" class="tc-serif fs-5 d-block">${TC.escapeHtml(w.name)}</a>
                      <button type="button" class="btn-tc-secondary btn-sm mt-2" onclick="TC.toggleCompare(${w.id});location.reload();">Remove</button>
                    </div>`)}
                  ${row('Maison / Brand', w => TC.escapeHtml(w.brandName))}
                  ${row('Price', w => `<span class="tc-price fw-semibold">${TC.formatInr(w.sellingPrice)}</span>`)}
                  ${row('Movement', w => TC.escapeHtml(w.movementType))}
                  ${row('Case Diameter', w => `<span class="tc-num">${TC.escapeHtml(w.caseDiameterMm)} mm (${TC.escapeHtml(w.caseMaterial)})</span>`)}
                  ${row('Water Resistance', w => `<span class="tc-num">${TC.escapeHtml(w.waterResistanceM)} m</span>`)}
                  ${row('Crystal Type', w => TC.escapeHtml(w.crystalType))}
                  ${row('Strap Material', w => TC.escapeHtml(w.strapMaterial))}
                  ${row('Dial Color', w => TC.escapeHtml(w.dialColor))}
                  ${row('Warranty', w => `${w.warrantyMonths} Months`)}
                </tbody>
              </table>
            </div>`;
        } catch (err) {
            host.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
        }
    }

    document.getElementById('clearCompareBtn').addEventListener('click', () => {
        localStorage.removeItem('tc_compare_ids');
        TC.updateHeaderBadges();
        render();
    });
    await render();
});
</script>
</body>
</html>
