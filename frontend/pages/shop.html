<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All Watches · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 border-bottom pb-3 mb-4">
        <div>
            <div class="tc-eyebrow">Complete Horological Collection</div>
            <h1 class="display-6 tc-serif mb-1" id="tcCatalogTitle">Shop All Watches</h1>
            <p class="text-muted small mb-0" id="tcCatalogSubtitle">Mechanical, hand-wound, solar and precision quartz instruments.</p>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-3">
            <span class="small text-muted tc-num" id="tcResultCount">0 timepieces</span>
            <select id="filterSort" class="form-select form-select-sm" style="width:190px;max-width:100%;">
                <option value="featured">Sort: Featured</option>
                <option value="newest">Sort: Newest</option>
                <option value="popularity">Sort: Popularity</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="discount">Highest Discount</option>
            </select>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <form id="tcFilterForm" class="tc-panel vstack gap-3">
                <div>
                    <label class="form-label small text-uppercase">Keyword / SKU</label>
                    <input type="text" id="filterQuery" class="form-control form-control-sm" placeholder="Model, name, SKU...">
                </div>
                <div>
                    <label class="form-label small text-uppercase">Maison / Brand</label>
                    <select id="filterBrand" class="form-select form-select-sm"><option value="">All Maisons</option></select>
                </div>
                <div>
                    <label class="form-label small text-uppercase">Category</label>
                    <select id="filterCategory" class="form-select form-select-sm"><option value="">All Categories</option></select>
                </div>
                <div>
                    <label class="form-label small text-uppercase">Movement</label>
                    <select id="filterMovement" class="form-select form-select-sm"><option value="">All Movements</option></select>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Min ₹</label>
                        <input type="number" id="filter_minPrice" class="form-control form-control-sm">
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Max ₹</label>
                        <input type="number" id="filter_maxPrice" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Min mm</label>
                        <input type="number" id="filter_minDiameter" class="form-control form-control-sm" placeholder="32">
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Max mm</label>
                        <input type="number" id="filter_maxDiameter" class="form-control form-control-sm" placeholder="44">
                    </div>
                </div>
                <div>
                    <label class="form-label small text-uppercase">Strap Material</label>
                    <select id="filterStrap" class="form-select form-select-sm"><option value="">All Straps</option></select>
                </div>
                <div>
                    <label class="form-label small text-uppercase">Dial Color</label>
                    <select id="filterDial" class="form-select form-select-sm"><option value="">All Dial Colors</option></select>
                </div>
                <div>
                    <label class="form-label small text-uppercase">Min Water Resistance (m)</label>
                    <select id="filter_minWaterResistance" class="form-select form-select-sm">
                        <option value="">Any</option>
                        <option value="50">50 m+</option>
                        <option value="100">100 m+</option>
                        <option value="200">200 m+ (Dive)</option>
                        <option value="300">300 m+ (Saturation)</option>
                    </select>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Min Discount %</label>
                        <input type="number" id="filter_minDiscount" class="form-control form-control-sm" placeholder="10">
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-uppercase">Min Rating</label>
                        <input type="number" step="0.5" max="5" id="filter_minRating" class="form-control form-control-sm" placeholder="4">
                    </div>
                </div>
                <label class="small d-flex align-items-center gap-2">
                    <input type="checkbox" id="filterInStock"> In Stock Only
                </label>
                <div class="d-grid gap-2 pt-1">
                    <button type="submit" class="btn-tc-primary">Apply Filters</button>
                    <button type="button" id="tcResetFilters" class="btn-tc-secondary">Reset</button>
                </div>
            </form>
        </div>
        <div class="col-lg-9">
            <div class="row g-4" id="tcProductGrid"></div>
            <div id="tcPagination"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('shop');
    await TCCatalog.initCatalogPage('shop');
});
</script>
</body>
</html>
