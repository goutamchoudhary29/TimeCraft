<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horological Archive · TimeCraft Fine Watches</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="tc-section-header mb-4">
        <div>
            <div class="tc-eyebrow mb-1">Authorised Horological Archive</div>
            <h1 class="tc-section-heading" id="tcCatalogTitle">All Timepieces</h1>
            <p class="text-muted small mb-0 mt-1" id="tcCatalogSubtitle">
                Mechanical complications, hand-wound dress calibres, titanium GMTs, and contemporary precision instruments.
            </p>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-3">
            <span class="small text-muted tc-num" id="tcResultCount">0 timepieces</span>
            <select id="filterSort" class="form-select form-select-sm" style="width:205px;max-width:100%;" aria-label="Sort timepieces">
                <option value="featured">Sort: Curated Featured</option>
                <option value="newest">Sort: Newest Releases</option>
                <option value="price_desc">Valuation: High to Low</option>
                <option value="price_asc">Valuation: Low to High</option>
                <option value="popularity">Collector Popularity</option>
                <option value="rating">Highest Rated</option>
            </select>
        </div>
    </div>

    <!-- Curated Collection Tier Separation Bar -->
    <div class="tc-filter-bar pb-4 mb-4" id="tcTierQuickBar" style="border-bottom:1px solid var(--tc-border);" role="navigation" aria-label="Collection Tiers">
        <button type="button" class="tc-filter-pill active" data-preset="ALL">Complete Archive</button>
        <button type="button" class="tc-filter-pill" data-preset="HAUTE">Haute Horlogerie (₹80K+)</button>
        <button type="button" class="tc-filter-pill" data-preset="CONTEMPORARY">Contemporary Edit (&lt; ₹50K)</button>
        <button type="button" class="tc-filter-pill" data-preset="AUTOMATIC">Automatic Calibres</button>
        <button type="button" class="tc-filter-pill" data-preset="MEN">Men's Collection</button>
        <button type="button" class="tc-filter-pill" data-preset="WOMEN">Women's Collection</button>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <form id="tcFilterForm" class="tc-panel vstack gap-3">
                <div class="d-flex justify-content-between align-items-center pb-2" style="border-bottom:1px solid var(--tc-border);">
                    <span class="tc-eyebrow">Refine Dossier</span>
                </div>
                <div>
                    <label for="filterQuery" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Reference / Keyword</label>
                    <input type="text" id="filterQuery" class="form-control form-control-sm" placeholder="Model, Maison, SKU…">
                </div>
                <div>
                    <label for="filterBrand" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Maison / Atelier</label>
                    <select id="filterBrand" class="form-select form-select-sm"><option value="">All Maisons</option></select>
                </div>
                <div>
                    <label for="filterCategory" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Specialisation</label>
                    <select id="filterCategory" class="form-select form-select-sm"><option value="">All Categories</option></select>
                </div>
                <div>
                    <label for="filterGender" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Silhouette</label>
                    <select id="filterGender" class="form-select form-select-sm">
                        <option value="">All Collections</option>
                        <option value="MEN">Men's Timepieces</option>
                        <option value="WOMEN">Women's Timepieces</option>
                        <option value="UNISEX">Mid-Size / Unisex</option>
                    </select>
                </div>
                <div>
                    <label for="filterMovement" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Calibre / Movement</label>
                    <select id="filterMovement" class="form-select form-select-sm"><option value="">All Calibres</option></select>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label for="filter_minPrice" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Min ₹</label>
                        <input type="number" id="filter_minPrice" class="form-control form-control-sm tc-num" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="filter_maxPrice" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Max ₹</label>
                        <input type="number" id="filter_maxPrice" class="form-control form-control-sm tc-num" placeholder="700000">
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label for="filter_minDiameter" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Min mm</label>
                        <input type="number" id="filter_minDiameter" class="form-control form-control-sm tc-num" placeholder="32">
                    </div>
                    <div class="col-6">
                        <label for="filter_maxDiameter" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Max mm</label>
                        <input type="number" id="filter_maxDiameter" class="form-control form-control-sm tc-num" placeholder="44">
                    </div>
                </div>
                <div>
                    <label for="filterStrap" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Bracelet / Strap</label>
                    <select id="filterStrap" class="form-select form-select-sm"><option value="">All Straps</option></select>
                </div>
                <div>
                    <label for="filterDial" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Dial Finish</label>
                    <select id="filterDial" class="form-select form-select-sm"><option value="">All Dial Colors</option></select>
                </div>
                <div>
                    <label for="filter_minWaterResistance" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Water Resistance</label>
                    <select id="filter_minWaterResistance" class="form-select form-select-sm">
                        <option value="">Any Rating</option>
                        <option value="50">50 m+</option>
                        <option value="100">100 m+</option>
                        <option value="200">200 m+ (Dive)</option>
                        <option value="300">300 m+ (Saturation)</option>
                    </select>
                </div>
                <div>
                    <label for="filter_minRating" class="form-label small text-uppercase" style="font-size:10.5px;letter-spacing:0.12em;">Collector Rating</label>
                    <input type="number" step="0.5" min="1" max="5" id="filter_minRating" class="form-control form-control-sm tc-num" placeholder="4.0+">
                </div>
                <label class="small d-flex align-items-center gap-2 pt-1" style="cursor:pointer;">
                    <input type="checkbox" id="filterInStock"> Immediate Vault Availability
                </label>
                <div class="d-grid gap-2 pt-2">
                    <button type="submit" class="btn-tc-primary">Apply Refinement</button>
                    <button type="button" id="tcResetFilters" class="btn-tc-secondary">Reset All</button>
                </div>
            </form>
        </div>
        <div class="col-lg-9">
            <div class="row g-4" id="tcProductGrid"></div>
            <div id="tcPagination"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('shop');
    await TCCatalog.initCatalogPage('shop');
});
</script>
</body>
</html>
