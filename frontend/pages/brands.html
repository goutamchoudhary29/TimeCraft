<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Maisons · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Authorised Horological Partners</div>
        <h1 class="display-6 tc-serif mb-1">Watch Maisons &amp; Brands</h1>
        <p class="text-muted small mb-0">Independent ateliers and heritage houses curated by TimeCraft.</p>
    </div>
    <div class="row g-4" id="brandsDirectoryGrid"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('brands');
    const host = document.getElementById('brandsDirectoryGrid');
    try {
        const brands = await TC.api('/brands');
        host.innerHTML = brands.map(b => `
            <div class="col-md-6 col-lg-4">
              <div class="tc-panel h-100 d-flex flex-column justify-content-between">
                <div>
                  ${b.logoUrl ? `<img src="${TC.escapeHtml(b.logoUrl)}" alt="${TC.escapeHtml(b.name)}" style="height:42px;" class="mb-2">` : ''}
                  <div class="tc-eyebrow">${TC.escapeHtml(b.countryOfOrigin || 'Horology')} ${b.foundedYear ? '· Est. ' + b.foundedYear : ''}</div>
                  <h2 class="tc-serif fs-2 my-2">${TC.escapeHtml(b.name)}</h2>
                  <p class="text-muted small">${TC.escapeHtml(b.description || '')}</p>
                </div>
                <div class="pt-3">
                  <a href="/pages/brand-details.html?slug=${encodeURIComponent(b.slug)}" class="btn-tc-secondary w-100">View Maison Timepieces &rarr;</a>
                </div>
              </div>
            </div>`).join('');
    } catch (err) {
        host.innerHTML = `<div class="col-12"><div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div></div>`;
    }
});
</script>
</body>
</html>
