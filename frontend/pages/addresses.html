<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Addresses · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <div class="tc-eyebrow">Insured Delivery Destinations</div>
            <h1 class="display-6 tc-serif mb-0">Delivery Addresses</h1>
        </div>
        <a href="/pages/profile.html" class="btn-tc-secondary">&larr; Back to Profile</a>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="tc-panel">
                <h2 class="h4 tc-serif mb-3">Add Delivery Address</h2>
                <form id="addressForm" class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Recipient Full Name *</label>
                        <input type="text" id="adName" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small">10-Digit Mobile *</label>
                        <input type="tel" id="adPhone" class="form-control" required placeholder="9876543210">
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Address Line 1 *</label>
                        <input type="text" id="adLine1" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Address Line 2 / Landmark</label>
                        <input type="text" id="adLine2" class="form-control">
                    </div>
                    <div class="col-5">
                        <label class="form-label small">City *</label>
                        <input type="text" id="adCity" class="form-control" required>
                    </div>
                    <div class="col-4">
                        <label class="form-label small">State *</label>
                        <input type="text" id="adState" class="form-control" required>
                    </div>
                    <div class="col-3">
                        <label class="form-label small">PIN Code *</label>
                        <input type="text" id="adPin" class="form-control tc-num" required placeholder="560001">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Type</label>
                        <select id="adType" class="form-select">
                            <option value="HOME">HOME</option>
                            <option value="WORK">WORK</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="col-6 d-flex align-items-end">
                        <label class="small mb-2"><input type="checkbox" id="adDefault" checked> Set as Default</label>
                    </div>
                    <div class="col-12 pt-2">
                        <button type="submit" class="btn-tc-primary w-100">Save Address</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="row g-3" id="addressesHost"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    if (!TC.getUser()) {
        window.location.href = '/pages/login.html?next=/pages/addresses.html';
        return;
    }
    const host = document.getElementById('addressesHost');

    async function load() {
        const list = await TC.api('/addresses');
        if (!list.length) {
            host.innerHTML = '<div class="col-12"><div class="tc-panel text-muted small">No delivery addresses saved yet.</div></div>';
            return;
        }
        host.innerHTML = list.map(a => `
            <div class="col-md-6">
              <div class="tc-panel h-100 d-flex flex-column justify-content-between">
                <div class="small">
                  <div class="d-flex justify-content-between mb-1">
                    <span class="fw-semibold">${TC.escapeHtml(a.fullName)}</span>
                    <span class="badge bg-dark rounded-0">${a.addressType}${a.defaultAddress ? ' · DEFAULT' : ''}</span>
                  </div>
                  <div>${TC.escapeHtml(a.line1)} ${a.line2 ? ', ' + TC.escapeHtml(a.line2) : ''}</div>
                  <div>${TC.escapeHtml(a.city)}, ${TC.escapeHtml(a.state)} - <span class="tc-num">${TC.escapeHtml(a.postalCode)}</span> (${a.country})</div>
                  <div class="text-muted mt-1">Phone: ${TC.escapeHtml(a.phone)}</div>
                </div>
                <div class="d-flex gap-2 mt-3 pt-2 border-top">
                  ${!a.defaultAddress ? `<button type="button" class="btn-tc-secondary py-1 px-2" onclick="window.makeDefault(${a.id})">Set Default</button>` : ''}
                  <button type="button" class="btn-tc-secondary py-1 px-2 text-danger" onclick="window.delAddr(${a.id})">Delete</button>
                </div>
              </div>
            </div>`).join('');
    }

    document.getElementById('addressForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            await TC.api('/addresses', {
                method: 'POST',
                body: {
                    fullName: document.getElementById('adName').value,
                    phone: document.getElementById('adPhone').value,
                    line1: document.getElementById('adLine1').value,
                    line2: document.getElementById('adLine2').value,
                    city: document.getElementById('adCity').value,
                    state: document.getElementById('adState').value,
                    postalCode: document.getElementById('adPin').value,
                    country: 'IN',
                    addressType: document.getElementById('adType').value,
                    defaultAddress: document.getElementById('adDefault').checked
                }
            });
            TC.toast('Address saved');
            e.target.reset();
            await load();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });

    window.makeDefault = async (id) => {
        await TC.api(`/addresses/${id}/default`, { method: 'PATCH' });
        await load();
    };
    window.delAddr = async (id) => {
        await TC.api(`/addresses/${id}`, { method: 'DELETE' });
        await load();
    };
    await load();
});
</script>
</body>
</html>
