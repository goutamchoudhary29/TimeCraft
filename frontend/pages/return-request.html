<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns &amp; Refunds · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">7-Day Horological Inspection Guarantee</div>
        <h1 class="display-6 tc-serif mb-0">Request a Return or View Refund Status</h1>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="tc-panel">
                <h2 class="h4 tc-serif mb-3">Submit Return Request</h2>
                <form id="returnForm" class="vstack gap-2">
                    <div>
                        <label class="form-label small text-uppercase">Delivered Order *</label>
                        <select id="retOrderSelect" class="form-select" required></select>
                    </div>
                    <div>
                        <label class="form-label small text-uppercase">Order Item *</label>
                        <select id="retItemSelect" class="form-select" required></select>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small text-uppercase">Quantity *</label>
                            <input type="number" id="retQty" min="1" value="1" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-uppercase">Reason *</label>
                            <select id="retReason" class="form-select">
                                <option value="SIZE_OR_FIT">Case size / wrist fit</option>
                                <option value="MOVEMENT_ISSUE">Timekeeping / calibre issue</option>
                                <option value="TRANSIT_DAMAGE">Packaging or transit concern</option>
                                <option value="CHANGED_MIND">Changed preference (unworn)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="form-label small text-uppercase">Details &amp; Seal Condition</label>
                        <textarea id="retDetails" rows="3" class="form-control" placeholder="Confirm that factory seals, box and warranty card are intact..."></textarea>
                    </div>
                    <button type="submit" class="btn-tc-primary mt-2">Submit Return Request</button>
                </form>
            </div>
        </div>
        <div class="col-lg-7">
            <h2 class="h4 tc-serif mb-3">Return &amp; Refund History</h2>
            <div id="returnsHistoryHost" class="vstack gap-3"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    if (!TC.getUser()) {
        window.location.href = '/pages/login.html?next=/pages/return-request.html';
        return;
    }
    const orderSel = document.getElementById('retOrderSelect');
    const itemSel = document.getElementById('retItemSelect');
    const histHost = document.getElementById('returnsHistoryHost');

    async function load() {
        const [ordersPage, returns] = await Promise.all([
            TC.api('/orders?size=30'),
            TC.api('/returns')
        ]);
        const delivered = (ordersPage.content || []).filter(o => o.status === 'DELIVERED');
        orderSel.innerHTML = delivered.length
            ? delivered.map(o => `<option value="${o.id}">${TC.escapeHtml(o.orderNumber)} (${TC.formatInr(o.grandTotal)})</option>`).join('')
            : '<option value="">No DELIVERED orders eligible for return</option>';

        if (delivered.length) {
            await populateOrderItems(delivered[0].id);
        }

        histHost.innerHTML = (returns && returns.length)
            ? returns.map(r => `
                <div class="tc-panel">
                  <div class="d-flex justify-content-between small">
                    <span class="fw-semibold tc-num">${TC.escapeHtml(r.returnNumber)} · Order ${TC.escapeHtml(r.orderNumber)}</span>
                    <span class="badge bg-dark rounded-0">${r.status}</span>
                  </div>
                  <div class="small mt-1">Reason: ${TC.escapeHtml(r.reasonCode)} ${r.reasonDetails ? '— ' + TC.escapeHtml(r.reasonDetails) : ''}</div>
                  ${r.adminNote ? `<div class="small text-muted mt-1">Concierge Note: ${TC.escapeHtml(r.adminNote)}</div>` : ''}
                </div>`).join('')
            : '<div class="tc-panel text-muted small">No return requests submitted.</div>';
    }

    async function populateOrderItems(orderId) {
        if (!orderId) return;
        const detail = await TC.api('/orders/' + orderId);
        itemSel.innerHTML = (detail.items || []).map(i =>
            `<option value="${i.id}">${TC.escapeHtml(i.brandName)} ${TC.escapeHtml(i.productName)} (Returnable: ${i.returnableQuantity})</option>`
        ).join('');
    }

    orderSel.addEventListener('change', () => populateOrderItems(orderSel.value));

    document.getElementById('returnForm').addEventListener('submit', async e => {
        e.preventDefault();
        if (!orderSel.value || !itemSel.value) {
            TC.toast('Select a delivered order and item', 'error');
            return;
        }
        try {
            await TC.api('/returns', {
                method: 'POST',
                body: {
                    orderId: Number(orderSel.value),
                    reasonCode: document.getElementById('retReason').value,
                    reasonDetails: document.getElementById('retDetails').value,
                    items: [{
                        orderItemId: Number(itemSel.value),
                        quantity: Number(document.getElementById('retQty').value),
                        conditionNote: 'Unworn with box & papers'
                    }]
                }
            });
            TC.toast('Return request submitted');
            await load();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });

    await load();
});
</script>
</body>
</html>
