<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Reviews · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Verified Purchase Testimonials</div>
        <h1 class="display-6 tc-serif mb-0">Client Reviews &amp; Ratings</h1>
    </div>
    <div class="row g-4">
        <div class="col-lg-7">
            <h2 class="h4 tc-serif mb-3">Featured Collector Reviews</h2>
            <div id="publicReviewsHost" class="vstack gap-3"></div>
        </div>
        <div class="col-lg-5">
            <h2 class="h4 tc-serif mb-3">Your Submitted Reviews</h2>
            <div id="myReviewsHost" class="vstack gap-3"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('reviews');
    const pubHost = document.getElementById('publicReviewsHost');
    const myHost = document.getElementById('myReviewsHost');

    try {
        const featured = await TC.api('/reviews/featured');
        pubHost.innerHTML = (featured && featured.length)
            ? featured.map(r => `
                <div class="tc-panel">
                  <div class="d-flex justify-content-between small">
                    <a href="/pages/product-details.html?slug=${encodeURIComponent(r.productSlug)}" class="fw-semibold">${TC.escapeHtml(r.productName)}</a>
                    <span>${'★'.repeat(r.rating)} · ${TC.escapeHtml(r.reviewerName)}</span>
                  </div>
                  <div class="fw-medium mt-1">${TC.escapeHtml(r.title)}</div>
                  <p class="small text-muted mb-0 mt-1">${TC.escapeHtml(r.body)}</p>
                </div>`).join('')
            : '<div class="tc-panel text-muted small">Verified purchase reviews appear here once approved by our horological concierge.</div>';

        if (TC.getUser()) {
            const mine = await TC.api('/reviews/me');
            myHost.innerHTML = (mine && mine.length)
                ? mine.map(r => `
                    <div class="tc-panel">
                      <div class="d-flex justify-content-between small">
                        <span class="fw-semibold">${TC.escapeHtml(r.productName)} (${'★'.repeat(r.rating)})</span>
                        <span class="badge bg-dark rounded-0">${r.status}</span>
                      </div>
                      <div class="small fw-medium mt-1">${TC.escapeHtml(r.title)}</div>
                      <div class="small text-muted">${TC.escapeHtml(r.body)}</div>
                    </div>`).join('')
                : '<div class="tc-panel text-muted small">You have not submitted any timepiece reviews yet.</div>';
        } else {
            myHost.innerHTML = '<div class="tc-panel text-muted small"><a href="/pages/login.html" class="fw-semibold">Sign in</a> to manage your submitted reviews.</div>';
        }
    } catch (err) {
        pubHost.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
    }
});
</script>
</body>
</html>
