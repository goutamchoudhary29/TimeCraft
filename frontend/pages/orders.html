<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <div class="tc-eyebrow">Collector Archive</div>
            <h1 class="display-6 tc-serif mb-0">Your Orders</h1>
        </div>
        <a href="/pages/return-request.html" class="btn-tc-secondary">Returns &amp; Refunds</a>
    </div>
    <div id="ordersHost" class="vstack gap-3"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('orders');
    if (!TC.getUser()) {
        window.location.href = '/pages/login.html?next=/pages/orders.html';
        return;
    }
    const host = document.getElementById('ordersHost');
    try {
        const page = await TC.api('/orders?size=25');
        if (!page.content || !page.content.length) {
            host.innerHTML = `<div class="tc-panel text-center py-5"><h2 class="tc-serif fs-3">You have not placed any orders yet</h2><a href="/pages/shop.html" class="btn-tc-primary mt-2">Explore Watches</a></div>`;
            return;
        }
        host.innerHTML = page.content.map(o => `
            <div class="tc-panel d-flex flex-wrap justify-content-between align-items-center gap-3">
              <div>
                <div class="small text-muted tc-num">Placed ${new Date(o.placedAt).toLocaleString()}</div>
                <div class="fs-5 tc-serif fw-semibold tc-num">${TC.escapeHtml(o.orderNumber)}</div>
                <div class="small">Status: <strong>${TC.escapeHtml(o.status)}</strong> · Payment: <strong>${TC.escapeHtml(o.paymentStatus)}</strong> · ${o.itemCount} item(s)</div>
              </div>
              <div class="d-flex align-items-center gap-3">
                <div class="tc-price fs-5 fw-semibold">${TC.formatInr(o.grandTotal)}</div>
                <a href="/pages/order-details.html?order=${encodeURIComponent(o.orderNumber)}" class="btn-tc-secondary">Inspect Order</a>
              </div>
            </div>`).join('');
    } catch (err) {
        host.innerHTML = `<div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div>`;
    }
});
</script>
</body>
</html>
