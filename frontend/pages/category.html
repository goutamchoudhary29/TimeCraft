<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Collection · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <div class="tc-eyebrow">Category Collection</div>
            <h1 class="display-6 tc-serif mb-1" id="tcCatalogTitle">Watch Category</h1>
            <p class="text-muted small mb-0" id="tcCatalogSubtitle"></p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="small text-muted tc-num" id="tcResultCount">0 timepieces</span>
            <select id="filterSort" class="form-select form-select-sm" style="width:190px;">
                <option value="featured">Sort: Featured</option>
                <option value="newest">Sort: Newest</option>
                <option value="popularity">Sort: Popularity</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="discount">Highest Discount</option>
            </select>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-lg-3">
            <form id="tcFilterForm" class="tc-panel vstack gap-3">
                <select id="filterCategory" class="form-select form-select-sm"><option value="">All Categories</option></select>
                <select id="filterBrand" class="form-select form-select-sm"><option value="">All Maisons</option></select>
                <select id="filterMovement" class="form-select form-select-sm"><option value="">All Movements</option></select>
                <select id="filterStrap" class="form-select form-select-sm"><option value="">All Straps</option></select>
                <select id="filterDial" class="form-select form-select-sm"><option value="">All Dial Colors</option></select>
                <label class="small"><input type="checkbox" id="filterInStock"> In Stock Only</label>
                <button type="submit" class="btn-tc-primary">Filter</button>
                <button type="button" id="tcResetFilters" class="btn-tc-secondary">Reset</button>
            </form>
        </div>
        <div class="col-lg-9">
            <div class="row g-4" id="tcProductGrid"></div>
            <div id="tcPagination"></div>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('category');
    await TCCatalog.initCatalogPage('category');
});
</script>
</body>
</html>
