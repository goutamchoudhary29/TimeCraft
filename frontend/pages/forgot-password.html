<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:460px;">
    <div class="tc-panel">
        <div class="tc-eyebrow">Account Recovery</div>
        <h1 class="h2 tc-serif mb-2">Reset Your Password</h1>
        <p class="text-muted small mb-4">Enter your registered email address and we will send a 30-minute one-time reset link.</p>
        <form id="forgotForm" class="vstack gap-3">
            <div>
                <label class="form-label small text-uppercase">Email Address</label>
                <input type="email" id="forgotEmail" class="form-control" required>
            </div>
            <button type="submit" class="btn-tc-primary w-100">Send Reset Link</button>
        </form>
        <div class="border-top mt-4 pt-3 small text-center">
            <a href="/pages/login.html">&larr; Back to Sign In</a>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    document.getElementById('forgotForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const res = await TC.api('/auth/forgot-password', {
                method: 'POST',
                body: { email: document.getElementById('forgotEmail').value }
            });
            TC.toast(res.message);
            e.target.reset();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
