<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · TimeCraft</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:480px;">
    <div class="tc-panel">
        <div class="tc-eyebrow">Account Recovery</div>
        <h1 class="h2 tc-serif mb-2">Reset Your Password</h1>
        <p class="text-muted small mb-4">Enter your registered email address and we will send a 6-digit security code (valid for 10 minutes).</p>
        <form id="forgotForm" class="vstack gap-3">
            <div>
                <label class="form-label small text-uppercase">Email Address</label>
                <input type="email" id="forgotEmail" class="form-control" required placeholder="collector@example.com">
            </div>
            <div id="forgotFeedback" class="small"></div>
            <button type="submit" id="forgotBtn" class="btn-tc-primary w-100">Send 6-Digit Reset Code</button>
        </form>
        <div class="border-top mt-4 pt-3 small text-center">
            <a href="/pages/login.html">&larr; Back to Sign In</a>
        </div>
    </div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    document.getElementById('forgotForm').addEventListener('submit', async e => {
        e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('forgotBtn');
        const fb = document.getElementById('forgotFeedback');
        btn.disabled = true;
        btn.textContent = 'Sending Reset Code…';
        fb.textContent = '';
        try {
            const res = await TC.api('/auth/forgot-password', {
                method: 'POST',
                body: { email }
            });
            if (res && res.devOtp) {
                sessionStorage.setItem('tc_reset_dev_otp', res.devOtp);
            } else {
                sessionStorage.removeItem('tc_reset_dev_otp');
            }
            TC.toast((res && res.message) || '6-digit reset code sent to your email.');
            window.location.href = '/pages/reset-password.html?email=' + encodeURIComponent(email);
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Send 6-Digit Reset Code';
            fb.innerHTML = `<span class="text-danger">${TC.escapeHtml(err.message)}</span>`;
            TC.toast(err.message, 'error');
        }
    });
});
</script>
</body>
</html>
