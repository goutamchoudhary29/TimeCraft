<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" style="max-width:680px;">
    <div class="tc-panel text-center py-5" id="confirmHost"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome();
    const params = new URLSearchParams(window.location.search);
    const orderNo = params.get('order') || '';
    const host = document.getElementById('confirmHost');
    try {
        const order = await TC.api('/orders/' + encodeURIComponent(orderNo));
        host.innerHTML = `
            <div class="tc-eyebrow mb-1">Order &amp; Payment Verified</div>
            <h1 class="display-6 tc-serif mb-2">Thank You for Your Order</h1>
            <p class="text-muted small mb-4">
              Order <strong class="tc-num">${TC.escapeHtml(order.orderNumber)}</strong> (${TC.escapeHtml(order.status)}) for
              <strong class="tc-price">${TC.formatInr(order.grandTotal)}</strong> has been confirmed. Our horologists are preparing your timepiece for insured dispatch.
            </p>
            <div class="d-flex justify-content-center gap-2">
              <a href="/pages/order-details.html?order=${encodeURIComponent(order.orderNumber)}" class="btn-tc-primary">View Order &amp; Download Invoice</a>
              <a href="/pages/shop.html" class="btn-tc-secondary">Continue Exploring</a>
            </div>`;
    } catch (err) {
        host.innerHTML = `<h2 class="tc-serif">Order Confirmation</h2><p class="text-muted small">${TC.escapeHtml(err.message)}</p><a href="/pages/orders.html" class="btn-tc-primary">View Orders</a>`;
    }
});
</script>
</body>
</html>
