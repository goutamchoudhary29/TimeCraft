<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5">
    <div class="border-bottom pb-3 mb-4">
        <div class="tc-eyebrow">Private Watch Curation</div>
        <h1 class="display-6 tc-serif mb-0">Your Wishlist</h1>
    </div>
    <div id="wishlistHost" class="row g-4"></div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('wishlist');
    const host = document.getElementById('wishlistHost');
    if (!TC.getUser()) {
        host.innerHTML = `<div class="col-12"><div class="tc-panel text-center py-5"><h2 class="tc-serif fs-3">Sign in to view your saved watches</h2><a href="/pages/login.html" class="btn-tc-primary mt-2">Sign In</a></div></div>`;
        return;
    }

    async function load() {
        try {
            const list = await TC.api('/wishlist');
            if (!list || !list.length) {
                host.innerHTML = `<div class="col-12"><div class="tc-panel text-center py-5"><h2 class="tc-serif fs-3">Your wishlist is empty</h2><a href="/pages/shop.html" class="btn-tc-primary mt-2">Browse Watches</a></div></div>`;
                return;
            }
            host.innerHTML = list.map(item => `
                <div class="col-sm-6 col-lg-3">
                  <div class="tc-watch-card">
                    <a href="/pages/product-details.html?slug=${encodeURIComponent(item.productSlug)}" class="tc-watch-media d-block">
                      <img src="${TC.escapeHtml(item.imageUrl)}" alt="${TC.escapeHtml(item.productName)}">
                    </a>
                    <div class="tc-watch-body">
                      <div>
                        <div class="tc-watch-brand">${TC.escapeHtml(item.brandName)}</div>
                        <h3 class="tc-watch-title">${TC.escapeHtml(item.productName)}</h3>
                        <div class="tc-price fw-semibold mb-3">${TC.formatInr(item.sellingPrice)}</div>
                      </div>
                      <div class="d-flex gap-1">
                        <button type="button" class="btn-tc-primary flex-grow-1 py-2" ${!item.available ? 'disabled' : ''}
                                onclick="window.moveWish(${item.id})">${item.available ? 'Move to Bag' : 'Out of Stock'}</button>
                        <button type="button" class="btn-tc-secondary py-2 px-2" onclick="window.removeWish(${item.id})">&times;</button>
                      </div>
                    </div>
                  </div>
                </div>`).join('');
        } catch (err) {
            host.innerHTML = `<div class="col-12"><div class="alert alert-danger rounded-0">${TC.escapeHtml(err.message)}</div></div>`;
        }
    }

    window.moveWish = async (id) => {
        try {
            await TC.api(`/wishlist/items/${id}/move-to-cart`, { method: 'POST' });
            TC.toast('Moved timepiece to your shopping bag');
            TC.updateHeaderBadges();
            await load();
        } catch (err) {
            TC.toast(err.message, 'error');
        }
    };
    window.removeWish = async (id) => {
        await TC.api(`/wishlist/items/${id}`, { method: 'DELETE' });
        await load();
    };
    await load();
});
</script>
</body>
</html>
