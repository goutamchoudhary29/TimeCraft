<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timepiece Details · TimeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="tcHeader"></div>
<main class="container py-5" id="pdpRoot">
    <div class="py-5 text-center text-muted">Loading timepiece dossier…</div>
</main>
<div id="tcFooter"></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await TC.mountChrome('shop');
    const params = new URLSearchParams(window.location.search);
    const slugOrId = params.get('slug') || params.get('id') || 'aurelian-lune-moonphase-40';
    const root = document.getElementById('pdpRoot');

    try {
        const p = await TC.api('/products/' + encodeURIComponent(slugOrId));
        document.title = `${p.brandName} ${p.name} · TimeCraft`;
        const primaryImg = (p.images && p.images.length) ? p.images[0].url : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1200';
        const activeVariants = (p.variants || []).filter(v => v.active);
        const firstVariant = activeVariants.find(v => v.availableStock > 0) || activeVariants[0] || {};

        TC.recordRecentlyViewed({
            id: p.id,
            name: p.name,
            slug: p.slug,
            brandName: p.brandName,
            sellingPrice: p.sellingPrice,
            regularPrice: p.regularPrice,
            discountPercent: p.discountPercent,
            movementType: p.movementType,
            caseDiameterMm: p.caseDiameterMm,
            waterResistanceM: p.waterResistanceM,
            defaultVariantId: firstVariant.id,
            totalAvailableStock: p.totalAvailableStock,
            primaryImageUrl: primaryImg
        });

        root.innerHTML = `
        <div class="row g-5">
          <div class="col-lg-6">
            <div class="tc-watch-media mb-3">
              <img id="pdpMainImage" src="${TC.escapeHtml(primaryImg)}" alt="${TC.escapeHtml(p.name)}">
            </div>
            <div class="d-flex gap-2 flex-wrap">
              ${(p.images || []).map(img => `
                <img src="${TC.escapeHtml(img.url)}" alt="${TC.escapeHtml(img.altText || p.name)}"
                     style="width:74px;height:92px;object-fit:cover;border:1px solid #E5E2DC;cursor:pointer;"
                     onclick="document.getElementById('pdpMainImage').src='${TC.escapeHtml(img.url)}'">`).join('')}
            </div>
          </div>
          <div class="col-lg-6">
            <a href="/pages/brand-details.html?slug=${encodeURIComponent(p.brandSlug)}" class="tc-eyebrow d-inline-block mb-1">${TC.escapeHtml(p.brandName)}</a>
            <h1 class="display-5 tc-serif mb-1">${TC.escapeHtml(p.name)}</h1>
            <div class="small text-muted mb-3">Model ${TC.escapeHtml(p.modelName)} · Master SKU <span class="tc-num" id="pdpSku">${TC.escapeHtml(firstVariant.sku || p.sku)}</span></div>

            <div class="d-flex align-items-baseline gap-3 mb-3 tc-price">
              <span class="fs-3 fw-semibold" id="pdpSellingPrice">${TC.formatInr(firstVariant.sellingPrice || p.sellingPrice)}</span>
              ${Number(p.discountPercent) > 0 ? `<span class="text-muted text-decoration-line-through" id="pdpRegularPrice">${TC.formatInr(firstVariant.regularPrice || p.regularPrice)}</span>
              <span class="badge bg-dark rounded-0">-${Math.round(p.discountPercent)}%</span>` : ''}
            </div>

            <p class="text-muted mb-4">${TC.escapeHtml(p.description || p.shortDescription || '')}</p>

            <div class="tc-panel mb-4">
              <div class="row g-3 align-items-end">
                <div class="col-md-8">
                  <label class="form-label small text-uppercase">Select Reference Variant</label>
                  <select id="pdpVariantSelect" class="form-select">
                    ${activeVariants.map(v => `
                      <option value="${v.id}" data-sku="${TC.escapeHtml(v.sku)}"
                              data-selling="${v.sellingPrice}" data-regular="${v.regularPrice}"
                              data-stock="${v.availableStock}"
                              ${v.id === firstVariant.id ? 'selected' : ''}>
                        ${TC.escapeHtml(v.name)} — ${TC.formatInr(v.sellingPrice)} (${v.availableStock > 0 ? v.availableStock + ' in stock' : 'Out of stock'})
                      </option>`).join('')}
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label small text-uppercase">Quantity</label>
                  <input type="number" id="pdpQty" min="1" max="5" value="1" class="form-control tc-num">
                </div>
                <div class="col-12 d-flex flex-wrap gap-2 pt-2">
                  <button type="button" id="pdpAddCartBtn" class="btn-tc-primary flex-grow-1"
                          ${(firstVariant.availableStock || 0) <= 0 ? 'disabled' : ''}>
                    ${(firstVariant.availableStock || 0) <= 0 ? 'Currently Sold Out' : 'Add Timepiece to Bag'}
                  </button>
                  <button type="button" class="btn-tc-secondary" onclick="TC.quickAddToWishlist(${p.id}, document.getElementById('pdpVariantSelect')?.value)">♥ Wishlist</button>
                  <button type="button" class="btn-tc-secondary" onclick="TC.toggleCompare(${p.id})">⇄ Compare</button>
                </div>
              </div>
              <div class="small text-muted mt-3 pt-2 border-top d-flex justify-content-between">
                <span>✓ Authorised ${p.warrantyMonths}-Month Maison Warranty</span>
                <span>✓ Insured Armoured Delivery</span>
              </div>
            </div>

            <h2 class="h4 tc-serif mb-2">Horological Specifications</h2>
            <table class="table table-bordered tc-spec-table small mb-0">
              <tbody>
                <tr><th>Maison</th><td>${TC.escapeHtml(p.brandName)}</td></tr>
                <tr><th>Model Reference</th><td class="tc-num">${TC.escapeHtml(p.modelName)}</td></tr>
                <tr><th>Calibre / Movement</th><td>${TC.escapeHtml(p.movementType)}</td></tr>
                <tr><th>Case Diameter</th><td class="tc-num">${TC.escapeHtml(p.caseDiameterMm)} mm</td></tr>
                <tr><th>Case Material</th><td>${TC.escapeHtml(p.caseMaterial)}</td></tr>
                <tr><th>Water Resistance</th><td class="tc-num">${TC.escapeHtml(p.waterResistanceM)} m</td></tr>
                <tr><th>Crystal</th><td>${TC.escapeHtml(p.crystalType)}</td></tr>
                <tr><th>Strap / Bracelet</th><td>${TC.escapeHtml(p.strapMaterial)}</td></tr>
                <tr><th>Dial Color</th><td>${TC.escapeHtml(p.dialColor)}</td></tr>
                <tr><th>Warranty</th><td>${p.warrantyMonths} Months Official Warranty</td></tr>
                ${(p.attributes || []).map(a => `<tr><th>${TC.escapeHtml(a.name)}</th><td>${TC.escapeHtml(a.value)}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <section class="mt-5 pt-4 border-top">
          <div class="row g-4">
            <div class="col-lg-7">
              <h2 class="h3 tc-serif mb-3">Verified Collector Reviews (${p.reviewCount})</h2>
              <div id="pdpReviewsHost" class="vstack gap-3"></div>
            </div>
            <div class="col-lg-5">
              <div class="tc-panel">
                <h3 class="h5 tc-serif mb-2">Submit a Verified Purchase Review</h3>
                <p class="text-muted small">Only collectors with a delivered order containing this timepiece may submit a review.</p>
                <form id="pdpReviewForm" class="vstack gap-2">
                  <select id="revRating" class="form-select form-select-sm">
                    <option value="5">★★★★★ (5 / 5)</option>
                    <option value="4">★★★★☆ (4 / 5)</option>
                    <option value="3">★★★☆☆ (3 / 5)</option>
                    <option value="2">★★☆☆☆ (2 / 5)</option>
                    <option value="1">★☆☆☆☆ (1 / 5)</option>
                  </select>
                  <input type="text" id="revTitle" class="form-control form-control-sm" required placeholder="Review headline">
                  <textarea id="revBody" rows="3" class="form-control form-control-sm" required placeholder="Share your impressions of the movement, finishing and comfort..."></textarea>
                  <button type="submit" class="btn-tc-primary">Submit for Moderation</button>
                </form>
              </div>
            </div>
          </div>
        </section>

        <section class="mt-5 pt-4 border-top">
          <h2 class="h3 tc-serif mb-3">Recently Viewed Timepieces</h2>
          <div class="row g-4" id="pdpRecentGrid"></div>
        </section>`;

        const variantSel = document.getElementById('pdpVariantSelect');
        const addBtn = document.getElementById('pdpAddCartBtn');
        variantSel.addEventListener('change', () => {
            const opt = variantSel.selectedOptions[0];
            if (!opt) return;
            document.getElementById('pdpSku').textContent = opt.getAttribute('data-sku');
            document.getElementById('pdpSellingPrice').textContent = TC.formatInr(opt.getAttribute('data-selling'));
            const stock = Number(opt.getAttribute('data-stock') || 0);
            addBtn.disabled = stock <= 0;
            addBtn.textContent = stock <= 0 ? 'Currently Sold Out' : 'Add Timepiece to Bag';
        });
        addBtn.addEventListener('click', () => {
            const qty = Number(document.getElementById('pdpQty').value || 1);
            TC.quickAddToCart(variantSel.value, qty);
        });

        // Load approved reviews
        const revs = await TC.api(`/products/${p.id}/reviews`);
        const revHost = document.getElementById('pdpReviewsHost');
        if (!revs.content || revs.content.length === 0) {
            revHost.innerHTML = '<div class="text-muted small">No published collector reviews yet for this reference.</div>';
        } else {
            revHost.innerHTML = revs.content.map(r => `
                <div class="tc-panel">
                  <div class="d-flex justify-content-between small">
                    <span class="fw-semibold">${TC.escapeHtml(r.title)} · ${'★'.repeat(r.rating)}</span>
                    <span class="text-muted">Verified Purchase · ${TC.escapeHtml(r.reviewerName)}</span>
                  </div>
                  <p class="small text-muted mb-0 mt-2">${TC.escapeHtml(r.body)}</p>
                </div>`).join('');
        }

        document.getElementById('pdpReviewForm').addEventListener('submit', async e => {
            e.preventDefault();
            if (!TC.getUser()) {
                TC.toast('Please sign in to submit a verified review', 'error');
                return;
            }
            try {
                await TC.api('/reviews', {
                    method: 'POST',
                    body: {
                        productId: p.id,
                        rating: Number(document.getElementById('revRating').value),
                        title: document.getElementById('revTitle').value,
                        body: document.getElementById('revBody').value
                    }
                });
                TC.toast('Review submitted for concierge moderation');
                e.target.reset();
            } catch (err) {
                TC.toast(err.message, 'error');
            }
        });

        const recent = TC.getRecentlyViewed().filter(x => x.id !== p.id).slice(0, 4);
        document.getElementById('pdpRecentGrid').innerHTML = recent.length
            ? recent.map(TC.renderWatchCard).join('')
            : '<div class="col-12 text-muted small">Browse more watches to build your recently viewed tray.</div>';
    } catch (err) {
        root.innerHTML = `<div class="tc-panel text-center py-5"><h2 class="tc-serif">Timepiece not found</h2><p class="text-muted small">${TC.escapeHtml(err.message)}</p><a href="/pages/shop.html" class="btn-tc-primary">Return to Catalog</a></div>`;
    }
});
</script>
</body>
</html>
